<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    .auth-tab-wrapper {
      background-color: #f1f5f9;
      padding: 5px;
      border-radius: 10px;
    }
    .auth-tab-wrapper .nav-link {
      color: #495057 !important;
      border-radius: 8px !important;
      padding: 10px 0;
      transition: all 0.3s ease;
    }
    .auth-tab-wrapper .nav-link.active {
      background-color: #0d6efd !important;
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .country-code-select {
      max-width: 140px;
      font-weight: 600;
      background-color: #f8fafc;
      border-right: none;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-teal sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="highlight">Library</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="authors.html">Authors</a></li>
          <li class="nav-item d-none" id="uploadNavArea"><a class="nav-link" href="upload.html">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-lg rounded-3">
        <div class="card-body p-4 p-sm-5">
          
          <!-- Alert Box for Notifications -->
          <div id="authAlert" class="alert d-none text-center" role="alert"></div>

          <!-- Nav Tabs for Login / Register -->
          <div class="auth-tab-wrapper mb-4" id="authTabsContainer">
            <ul class="nav nav-pills nav-justified" id="authTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Login</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Sign Up</button>
              </li>
            </ul>
          </div>

          <div class="tab-content" id="authTabContent">
            
            <!-- LOGIN FORM -->
            <div class="tab-pane fade show active" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
              <h3 class="text-center mb-4 text-teal fw-bold">Welcome Back</h3>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label fw-semibold">Email address</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com">
                  </div>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label fw-semibold">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter password">
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                  </div>
                  <a href="#" class="small text-decoration-none text-teal">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-teal w-100 py-2 fw-bold">Login</button>
                
                <div class="text-center mt-4 pt-3 border-top">
                  <a href="admin-login.html" class="text-decoration-none text-muted small hover-teal">
                    <i class="fa-solid fa-shield-halved me-1"></i> Admin Login
                  </a>
                </div>
              </form>
            </div>

            <!-- SIGN UP FORM -->
            <div class="tab-pane fade" id="register-panel" role="tabpanel" aria-labelledby="register-tab">
              <h3 class="text-center mb-4 text-teal fw-bold" id="registerTitle">Create Account</h3>
              <form id="registerForm" novalidate>
                
                <!-- REGISTRATION FIELDS -->
                <div id="signupFields">
                  <!-- First Name & Last Name Fields -->
                  <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                      <label for="regFirstName" class="form-label fw-semibold">First Name</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="regFirstName" placeholder="First Name" required>
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <label for="regLastName" class="form-label fw-semibold">Last Name</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="regLastName" placeholder="Last Name" required>
                      </div>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="regEmail" class="form-label fw-semibold">Email address</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                      <input type="email" class="form-control" id="regEmail" placeholder="name@example.com">
                    </div>
                  </div>

                  <!-- Mobile Number with +91 Default & Country Dropdown -->
                  <div class="mb-3">
                    <label for="regPhone" class="form-label fw-semibold">Mobile Number</label>
                    <div class="input-group">
                      <select class="form-select country-code-select" id="regCountryCode">
                        <option value="+91" selected>🇮🇳 +91 (IN)</option>
                        <option value="+880">🇧🇩 +880 (BD)</option>
                        <option value="+977">🇳🇵 +977 (NP)</option>
                        <option value="+1">🇺🇸 +1 (US/CA)</option>
                        <option value="+44">🇬🇧 +44 (UK)</option>
                        <option value="+971">🇦🇪 +971 (UAE)</option>
                        <option value="+61">🇦🇺 +61 (AU)</option>
                        <option value="+65">🇸🇬 +65 (SG)</option>
                        <option value="+60">🇲🇾 +60 (MY)</option>
                        <option value="+49">🇩🇪 +49 (DE)</option>
                        <option value="+33">🇫🇷 +33 (FR)</option>
                        <option value="other">🌐 Other...</option>
                      </select>
                      <input type="tel" class="form-control" id="regPhone" placeholder="9876543210" required>
                    </div>
                    <div id="customCountryCodeWrapper" class="mt-2 d-none">
                      <input type="text" class="form-control form-control-sm" id="customCountryCode" placeholder="Enter custom country code (e.g. +81)">
                    </div>
                  </div>

                  <!-- Role Selection: Reader / Author / Publisher / Distributor -->
                  <div class="mb-3">
                    <label for="regRole" class="form-label fw-semibold">I want to join as</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                      <select class="form-select" id="regRole" required>
                        <option value="reader" selected>Reader</option>
                        <option value="author">Author / Publisher</option>
                        <option value="distributor">Distributor / Vendor</option>
                      </select>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="regPassword" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                      <input type="password" class="form-control" id="regPassword" placeholder="Create password">
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="regConfirmPassword" class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                      <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm password">
                    </div>
                  </div>

                  <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark mt-2" id="signUpBtn">Sign Up</button>
                </div>

              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-teal text-center mt-auto py-3">
    <div class="container">
      <p class="mb-1 fw-bold">&copy; 2026 Santali Digital Library</p>
      <p class="small mb-0 text-white-50">Made with ❤️ for Authors & Readers</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Interactive Mobile Prefix & Auto Tab Handler -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.location.hash === "#register") {
        const registerTab = new bootstrap.Tab(document.querySelector('#register-tab'));
        registerTab.show();
      }

      // Handle custom country code dropdown toggle
      const countrySelect = document.getElementById('regCountryCode');
      const customWrapper = document.getElementById('customCountryCodeWrapper');
      const customInput = document.getElementById('customCountryCode');

      countrySelect?.addEventListener('change', function() {
        if (this.value === 'other') {
          customWrapper.classList.remove('d-none');
          customInput.focus();
        } else {
          customWrapper.classList.add('d-none');
        }
      });
    });
  </script>

  <!-- Supabase Auth Integration -->
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
