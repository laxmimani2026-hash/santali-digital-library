<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .detail-cover {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-teal sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
          <!-- User Profile Dropdown Area (Injected by auth.js) -->
          <li class="nav-item ms-lg-3 my-2 my-lg-0" id="userNavArea">
            <a href="login.html" class="btn btn-warning btn-sm fw-bold">Login / Sign Up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <div class="container my-5 flex-grow-1">
    
    <!-- Loading Spinner -->
    <div id="loadingIndicator" class="text-center my-5">
      <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
      <h5 class="mt-3 text-muted">Loading book details...</h5>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="alert alert-danger text-center d-none" role="alert">
      Book not found. It may have been removed.
    </div>

    <!-- Book Details Section (Hidden until loaded) -->
    <div id="bookContent" class="row d-none">
      
      <!-- Left Column: Cover Image -->
      <div class="col-md-5 col-lg-4 text-center mb-4 mb-md-0">
        <img id="detailCover" src="" alt="Book Cover" class="detail-cover img-fluid">
      </div>
      
      <!-- Right Column: Text & Buttons -->
      <div class="col-md-7 col-lg-8">
        <div class="d-flex align-items-center mb-2 gap-2">
          <span id="detailCategory" class="badge bg-teal text-uppercase" style="background-color: #005f73;"></span>
          <span id="detailLanguage" class="badge bg-secondary text-uppercase"></span>
        </div>
        
        <h1 id="detailTitle" class="fw-bold mb-1"></h1>
        <h5 class="text-muted mb-4">By <span id="detailAuthor" class="text-dark fw-semibold"></span></h5>
        
        <div class="mb-4">
          <h3 id="detailPrice" class="fw-bold text-success mb-0"></h3>
        </div>
        
        <h5 class="fw-bold border-bottom pb-2">Description</h5>
        <p id="detailDescription" class="text-muted" style="line-height: 1.7; white-space: pre-wrap;"></p>
        
        <!-- Action Buttons -->
        <div class="mt-5 d-flex gap-3">
          <a id="readBtn" href="#" target="_blank" class="btn btn-warning px-4 py-2 fw-bold text-dark shadow-sm">
            <i class="fa-solid fa-book-open me-2"></i> Read Book
          </a>
          <button class="btn btn-outline-secondary px-4 py-2 fw-semibold" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left me-2"></i> Go Back
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer-teal text-center mt-auto py-3" style="background-color: #005f73;">
    <div class="container">
      <p class="mb-1 fw-bold text-white">&copy; 2026 Santali Digital Library</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Global Auth Script -->
  <script type="module" src="assets/js/auth.js"></script>

  <!-- Fetch Specific Book Script -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =========================================================
    // ⚠️ REPLACE THESE WITH YOUR ACTUAL SUPABASE KEYS
    // =========================================================
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      
      // Get the book ID from the URL (e.g., book-details.html?id=12345)
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');

      const loadingIndicator = document.getElementById("loadingIndicator");
      const errorMessage = document.getElementById("errorMessage");
      const bookContent = document.getElementById("bookContent");

      if (!bookId) {
        loadingIndicator.classList.add("d-none");
        errorMessage.classList.remove("d-none");
        return;
      }

      try {
        // Fetch the single book from Supabase
        const { data: book, error } = await supabase
          .from('books')
          .select('*')
          .eq('id', bookId)
          .single();

        if (error || !book) throw error;

        // Populate the page with the book data
        document.getElementById("detailTitle").innerText = book.title;
        document.getElementById("detailAuthor").innerText = book.author;
        document.getElementById("detailCategory").innerText = book.category;
        document.getElementById("detailLanguage").innerText = book.language.replace('_', ' ');
        document.getElementById("detailDescription").innerText = book.description;
        
        // Handle image
        const coverImg = document.getElementById("detailCover");
        coverImg.src = book.cover_url;
        coverImg.onerror = () => { coverImg.src = 'https://via.placeholder.com/400x600?text=No+Cover'; };

        // Handle Price
        const priceElement = document.getElementById("detailPrice");
        if (book.pricing === 'free' || book.price === 0) {
          priceElement.innerText = "FREE";
          priceElement.className = "fw-bold text-success mb-0";
        } else {
          priceElement.innerText = `₹${book.price}`;
          priceElement.className = "fw-bold text-primary mb-0";
        }

        // Set the Read button to open the PDF
        document.getElementById("readBtn").href = book.pdf_url;

        // Hide loading, show content
        loadingIndicator.classList.add("d-none");
        bookContent.classList.remove("d-none");

      } catch (error) {
        console.error("Error fetching book details:", error);
        loadingIndicator.classList.add("d-none");
        errorMessage.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
