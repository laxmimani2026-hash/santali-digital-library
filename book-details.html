<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .badge-teal { background-color: #005f73; color: white; }
    
    /* Professional Cover Styling */
    .book-cover-large {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      object-fit: cover;
      border: 1px solid #e0e0e0;
      min-height: 450px;
      background-color: #f1f1f1;
    }
    
    .price-display {
      font-size: 2rem;
      color: #0d6efd;
      font-weight: 800;
    }

    /* Skeleton Loading Animation */
    .skeleton {
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
      color: transparent !important;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
    </div>
  </nav>

  <!-- Book Details Container -->
  <div class="container my-5 flex-grow-1">
    
    <!-- Alert Box for Cart/Errors -->
    <div id="pageAlert" class="alert d-none shadow-sm mb-4" role="alert"></div>

    <div class="row align-items-start bg-white p-4 p-md-5 rounded-4 shadow-sm border">
      
      <!-- Left Column: Book Cover -->
      <div class="col-md-4 col-lg-4 text-center text-md-start mb-4 mb-md-0">
        <!-- The 'onerror' attribute handles missing/broken images professionally -->
        <img src="" class="book-cover-large skeleton" alt="Book Cover" id="detailCover" 
             onerror="this.src='https://via.placeholder.com/320x450?text=Cover+Not+Available'; this.classList.remove('skeleton');">
      </div>
      
      <!-- Right Column: Details & Actions -->
      <div class="col-md-8 col-lg-8 ps-md-4">
        
        <!-- Badges -->
        <div class="mb-3" id="badgeContainer">
          <span class="badge badge-teal me-1 px-3 py-2 skeleton" id="detailCategory">CATEGORY</span>
          <span class="badge bg-secondary px-3 py-2">SANTALI</span>
        </div>
        
        <!-- Title & Author -->
        <h1 class="fw-bold text-dark mt-2 display-6 skeleton" id="detailTitle">Loading Book Title...</h1>
        <p class="text-muted fs-5 mb-4">By <span id="detailAuthor" class="fw-semibold text-dark skeleton">Author Name</span></p>
        
        <!-- Pricing -->
        <div class="price-display mb-4 skeleton" id="detailPrice">₹0</div>
        
        <!-- Description -->
        <h5 class="fw-bold text-dark border-bottom pb-2">Description</h5>
        <p class="text-secondary skeleton" id="detailDescription" style="line-height: 1.7; min-height: 80px;">
          Loading description...
        </p>

        <!-- Professional Action Buttons (Initially Disabled while loading) -->
        <div class="d-flex flex-wrap gap-3 mt-5">
          <!-- Buy Now -->
          <button class="btn btn-success fw-bold px-4 py-2 shadow-sm" id="buyNowBtn" disabled>
            <i class="fa-solid fa-bolt me-2"></i>Buy Now
          </button>
          
          <!-- Add to Cart -->
          <button class="btn btn-primary fw-bold px-4 py-2 shadow-sm" id="addToCartBtn" disabled>
            <i class="fa-solid fa-cart-plus me-2"></i>Add to Cart
          </button>
          
          <!-- Read Book -->
          <button class="btn btn-warning fw-bold px-4 py-2 shadow-sm text-dark" id="readBookBtn" disabled>
            <i class="fa-solid fa-book-open me-2"></i>Read Book
          </button>
          
          <!-- Close Tab -->
          <button class="btn btn-outline-secondary px-4 py-2 fw-semibold" onclick="window.close()">
            <i class="fa-solid fa-xmark me-2"></i>Close Tab
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Fetch Data & Button Logic -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =========================================================
    // ⚠️ KEEP YOUR ACTUAL SUPABASE KEYS HERE
    // =========================================================
    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE'; // Re-insert your long token here
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Get the book ID from the URL (e.g., book-details.html?id=123)
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');

      const pageAlert = document.getElementById('pageAlert');
      
      // DOM Elements
      const coverEl = document.getElementById('detailCover');
      const titleEl = document.getElementById('detailTitle');
      const authorEl = document.getElementById('detailAuthor');
      const priceEl = document.getElementById('detailPrice');
      const descEl = document.getElementById('detailDescription');
      const catEl = document.getElementById('detailCategory');
      
      const buyNowBtn = document.getElementById('buyNowBtn');
      const addToCartBtn = document.getElementById('addToCartBtn');
      const readBookBtn = document.getElementById('readBookBtn');

      if (!bookId) {
        showPageAlert("No book ID provided in URL.", "danger");
        return;
      }

      try {
        // 2. Fetch the specific book from Supabase
        const { data: book, error } = await supabase
          .from('books')
          .select('*')
          .eq('id', bookId)
          .single();

        if (error || !book) throw error;

        // 3. Populate the UI & Remove Skeleton Classes
        coverEl.src = book.cover_url || '';
        coverEl.classList.remove('skeleton');

        titleEl.textContent = book.title;
        titleEl.classList.remove('skeleton');

        authorEl.textContent = book.author;
        authorEl.classList.remove('skeleton');

        catEl.textContent = (book.category || 'GENERAL').toUpperCase();
        catEl.classList.remove('skeleton');

        descEl.textContent = book.description || 'No description available for this book.';
        descEl.classList.remove('skeleton');

        if (book.pricing === 'free' || book.price === 0) {
          priceEl.textContent = "FREE";
          priceEl.classList.replace('text-primary', 'text-success');
        } else {
          priceEl.textContent = `₹${book.price}`;
        }
        priceEl.classList.remove('skeleton');

        // 4. Enable Buttons
        buyNowBtn.disabled = false;
        addToCartBtn.disabled = false;
        readBookBtn.disabled = false;

        // ==========================================
        // BUTTON CLICK LOGIC
        // ==========================================

        // BUY NOW: Redirect to a checkout page
        buyNowBtn.addEventListener('click', () => {
          window.location.href = `checkout.html?id=${book.id}`;
        });

        // READ BOOK: Redirect to reading page (or open file URL directly)
        readBookBtn.addEventListener('click', () => {
          // If you have a PDF link in your DB, you could do: window.open(book.file_url, '_blank');
          // Otherwise, route to your reader UI:
          window.location.href = `read-book.html?id=${book.id}`;
        });

        // ADD TO CART: Save to Supabase
        addToCartBtn.addEventListener('click', async function () {
          // Check session
          const { data: { session }, error: sessionError } = await supabase.auth.getSession();

          if (!session) {
            showPageAlert("You need to be logged in to add items to your cart.", "warning");
            return;
          }

          // Disable button while processing
          this.disabled = true;
          this.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Adding...`;

          // Insert into cart_items table
          const { error: cartError } = await supabase
            .from('cart_items')
            .insert([{ user_id: session.user.id, book_id: book.id, quantity: 1 }]);

          if (cartError) {
            showPageAlert("Failed to add to cart. Please try again.", "danger");
            // Reset button
            this.disabled = false;
            this.innerHTML = `<i class="fa-solid fa-cart-plus me-2"></i>Add to Cart`;
          } else {
            showPageAlert("Book successfully added to your cart!", "success");
            // Change button state to success
            this.classList.replace('btn-primary', 'btn-success');
            this.innerHTML = `<i class="fa-solid fa-check me-2"></i>Added to Cart`;
          }
        });

      } catch (err) {
        console.error(err);
        showPageAlert("Failed to load book details. The book may have been removed.", "danger");
      }

      // Helper function for alerts
      function showPageAlert(message, type) {
        pageAlert.className = `alert alert-${type} shadow-sm mb-4`;
        pageAlert.textContent = message;
        pageAlert.classList.remove('d-none');
        window.scrollTo(0, 0); // Scroll to top to see error
      }
    });
  </script>
</body>
</html>
