<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .badge-teal { background-color: #005f73; color: white; }
    .book-cover-large {
      width: 100%;
      max-width: 350px;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navigation Bar (Same as your browse.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
    </div>
  </nav>

  <!-- Book Details Container -->
  <div class="container my-5">
    <div class="row align-items-start bg-white p-4 p-md-5 rounded shadow-sm">
      
      <!-- Left Column: Book Cover -->
      <div class="col-md-4 col-lg-4 text-center text-md-start mb-4 mb-md-0">
        <img src="assets/images/santali-grammar-cover.jpg" class="book-cover-large" alt="Book Cover" id="detailCover">
      </div>
      
      <!-- Right Column: Details & Actions -->
      <div class="col-md-8 col-lg-8 ps-md-4">
        
        <!-- Badges -->
        <div class="mb-2">
          <span class="badge badge-teal me-1 px-3 py-2">CHILDREN</span>
          <span class="badge bg-secondary px-3 py-2">SANTALI</span>
        </div>
        
        <!-- Title & Author -->
        <h1 class="fw-bold text-dark mt-3 display-6" id="detailTitle">book4</h1>
        <p class="text-muted fs-5 mb-4">By <span id="detailAuthor" class="fw-semibold text-dark">nkh</span></p>
        
        <!-- Pricing -->
        <h2 class="text-primary fw-bold mb-4" id="detailPrice">₹199</h2>
        
        <!-- Description -->
        <h5 class="fw-bold text-dark border-bottom pb-2">Description</h5>
        <p class="text-secondary" id="detailDescription" style="line-height: 1.7;">
          read the book
        </p>

        <!-- Professional Action Buttons -->
        <div class="d-flex flex-wrap gap-3 mt-5">
          <!-- Buy Now (Immediate Checkout action) -->
          <button class="btn btn-success fw-bold px-4 py-2 shadow-sm" id="buyNowBtn">
            <i class="fa-solid fa-bolt me-2"></i>Buy Now
          </button>
          
          <!-- Add to Cart -->
          <button class="btn btn-primary fw-bold px-4 py-2 shadow-sm" id="addToCartBtn" data-book-id="YOUR_BOOK_ID">
            <i class="fa-solid fa-cart-plus me-2"></i>Add to Cart
          </button>
          
          <!-- Read Book (For free books or already purchased) -->
          <button class="btn btn-warning fw-bold px-4 py-2 shadow-sm text-dark" id="readBookBtn">
            <i class="fa-solid fa-book-open me-2"></i>Read Book
          </button>
          
          <!-- Close Tab / Go Back (Since it opened in a new window, window.close() is best) -->
          <button class="btn btn-outline-secondary px-4 py-2 fw-semibold" onclick="window.close()">
            <i class="fa-solid fa-xmark me-2"></i>Close Tab
          </button>
        </div>

        <!-- Alert placeholder for cart notifications -->
        <div id="cartAlert" class="alert d-none mt-4" role="alert"></div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
