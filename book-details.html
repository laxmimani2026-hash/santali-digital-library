<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details | Santali Digital Library</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #005f73;
      --brand-teal: #0a9396;
      --primary-gold: #ffb703;
      --primary-hover: #e08e0b;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --surface-card: #ffffff;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --radius-xl: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Top Navigation --- */
    header {
      background-color: var(--bg-dark);
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
    }

    .logo i {
      color: var(--primary-gold);
      font-size: 1.4rem;
    }

    .logo span span {
      color: var(--primary-gold);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 24px;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--primary-gold);
    }

    /* User Profile Dropdown */
    .user-menu-container {
      position: relative;
    }

    .user-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .user-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .user-avatar-img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .role-badge {
      background-color: var(--primary-gold);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .dropdown-menu-custom {
      position: absolute;
      top: 110%;
      right: 0;
      width: 215px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
    }

    .user-menu-container:hover .dropdown-menu-custom,
    .dropdown-menu-custom.active {
      display: flex;
    }

    .dropdown-menu-custom a {
      padding: 11px 16px;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.88rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s ease;
    }

    .dropdown-menu-custom a:hover {
      background-color: #f1f5f9;
      color: var(--bg-dark);
    }

    .dropdown-menu-custom a i {
      color: #64748b;
      width: 16px;
    }

    /* --- Breadcrumb Bar --- */
    .breadcrumb-bar {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 0;
    }

    .breadcrumb {
      margin-bottom: 0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .breadcrumb-item a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .breadcrumb-item.active {
      color: var(--bg-dark);
      font-weight: 600;
    }

    /* --- Main Showcase Card --- */
    .book-detail-card {
      background: var(--surface-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .cover-panel {
      background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 30px;
      height: 100%;
      min-height: 480px;
      border-right: 1px solid var(--border-color);
    }

    .book-cover-container {
      position: relative;
      width: 240px;
      height: 350px;
      border-radius: 6px 14px 14px 6px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 
                  0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .book-cover-container:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .book-cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px 14px 14px 6px;
      display: block;
    }

    .book-spine-shine {
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.15) 60%, rgba(255,255,255,0.2) 100%);
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
      pointer-events: none;
    }

    /* Meta Badges */
    .meta-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .meta-tag-category { background: #e0f2fe; color: #0284c7; }
    .meta-tag-lang { background: #fef3c7; color: #d97706; }

    /* Specification Pills */
    .specs-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 22px 0;
    }

    .spec-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .spec-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .spec-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* Pricing Section */
    .price-box {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .price-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--bg-dark);
      line-height: 1;
    }

    /* Buttons */
    .action-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-action-buy {
      background-color: #10b981;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-action-buy:hover:not(:disabled) {
      background-color: #059669;
      transform: translateY(-2px);
      color: #ffffff;
    }

    .btn-action-cart {
      background-color: #ffffff;
      color: var(--bg-dark);
      border: 2px solid var(--bg-dark);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 10px 22px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-action-cart:hover:not(:disabled) {
      background-color: var(--bg-dark);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .btn-action-read {
      background-color: var(--primary-gold);
      color: #000000;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 183, 3, 0.25);
    }

    .btn-action-read:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Skeleton Placeholder */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.4s infinite;
      border-radius: 4px;
      color: transparent !important;
    }
    @keyframes skeletonLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
