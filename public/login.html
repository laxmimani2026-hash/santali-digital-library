<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Simple Header -->
  <nav class="navbar navbar-teal">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="highlight">Library</span></span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> Back to Home</a>
    </div>
  </nav>

  <!-- Auth Card Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          
          <!-- Tab Headers -->
          <div class="card-header bg-white border-0 p-0">
            <ul class="nav nav-tabs nav-justified border-bottom" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold py-3 text-dark" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">Sign In</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold py-3 text-dark" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">Create Account</button>
              </li>
            </ul>
          </div>

          <div class="card-body p-4 p-sm-5">
            <!-- Alert Message Box -->
            <div id="authAlert" class="alert d-none" role="alert"></div>

            <div class="tab-content" id="authTabsContent">
              
              <!-- ================= LOGIN FORM ================= -->
              <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <h4 class="fw-bold mb-1 text-teal">Welcome Back!</h4>
                <p class="text-muted small mb-4">Sign in to access your digital bookshelf</p>

                <form id="loginForm">
                  <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                  </div>
                  <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-3">Sign In</button>
                </form>

                <div class="text-center my-3 text-muted small">— OR —</div>

                <button type="button" id="googleAuthBtn" class="btn btn-outline-secondary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                  Sign in with Google
                </button>
              </div>

              <!-- ================= REGISTER FORM ================= -->
              <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <h4 class="fw-bold mb-1 text-teal">Join Our Community</h4>
                <p class="text-muted small mb-4">Create an account to read or publish books</p>

                <form id="registerForm">
                  <div class="mb-3">
                    <label class="form-label fw-semibold small">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="e.g. Somnath Hansda" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                  </div>
                  <div class="mb-4">
                    <label class="form-label fw-semibold small">I want to register as a:</label>
                    <select id="regRole" class="form-select" required>
                      <option value="reader" selected>Reader (Read & Purchase Books)</option>
                      <option value="author">Author (Publish & Sell eBooks)</option>
                    </select>
                  </div>
                  <button type="submit" class="btn btn-gold w-100 py-2 fw-bold">Create Account</button>
                </form>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
