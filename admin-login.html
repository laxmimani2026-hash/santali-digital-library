<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Santali Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .admin-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; padding: 2.5rem; }
    .form-control { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; }
    .form-control:focus { background-color: #0f172a; border-color: #38bdf8; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
    .btn-admin { background-color: #38bdf8; color: #0f172a; font-weight: 700; border: none; }
    .btn-admin:hover { background-color: #0ea5e9; color: #0f172a; }
  </style>
</head>
<body>

  <div class="admin-card">
    <div class="text-center mb-4">
      <i class="fa-solid fa-shield-halved text-info" style="font-size: 3rem;"></i>
      <h3 class="fw-bold mt-3">Admin Portal</h3>
      <p class="text-secondary small">Restricted Access Only</p>
    </div>

    <div id="adminAlert" class="alert d-none text-center small py-2" role="alert"></div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-bold">Admin Email</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" id="adminEmail" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-secondary small fw-bold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="adminPassword" required>
        </div>
      </div>
      <button type="submit" class="btn btn-admin w-100 py-2" id="loginBtn">Authenticate <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i></button>
    </form>
    
    <div class="text-center mt-4">
      <a href="index.html" class="text-decoration-none text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i> Return to Public Site</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const alertBox = document.getElementById('adminAlert');
      const loginBtn = document.getElementById('loginBtn');

      function showAlert(msg, type) {
        alertBox.className = `alert alert-${type} text-center small py-2`;
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Verifying...`;

      try {
        // 1. Authenticate the user
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // 2. Check if they are actually an Admin
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        if (profileError) throw profileError;

        if (profile.role !== 'admin') {
          // If not an admin, immediately log them out and show error
          await supabase.auth.signOut();
          throw new Error("Access Denied: You do not have administrator privileges.");
        }

        // 3. Success! Redirect to dashboard
        showAlert("Authentication successful. Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 1000);

      } catch (err) {
        showAlert(err.message || "Authentication failed.", "danger");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `Authenticate <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>`;
      }
    });
  </script>
</body>
</html>
