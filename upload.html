<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Dashboard | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .upload-card {
      border-radius: 12px;
      border: none;
    }
    .file-drop-area {
      border: 2px dashed #0d6efd;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      background-color: #f8f9fa;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .file-drop-area:hover {
      background-color: #e9ecef;
      border-color: #0b5ed7;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-teal sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="upload.html">Upload</a></li>
          <!-- User Profile Dropdown Area (Injected by auth.js) -->
          <li class="nav-item ms-lg-3 my-2 my-lg-0" id="userNavArea">
            <!-- Fallback if JS fails/loads slow -->
            <a href="login.html" class="btn btn-warning btn-sm fw-bold">Login / Sign Up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Dashboard Content -->
  <div class="container my-5 flex-grow-1">
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="fw-bold" style="color: #005f73;">
          <i class="fa-solid fa-cloud-arrow-up me-2 text-warning"></i> Author Dashboard
        </h2>
        <p class="text-muted">Upload and publish a new book to the Santali Digital Library.</p>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm upload-card">
          <div class="card-body p-4 p-md-5">
            
            <form id="uploadBookForm">
              <h5 class="fw-bold mb-4 border-bottom pb-2">Book Details</h5>
              
              <div class="row g-3 mb-4">
                <!-- Book Title -->
                <div class="col-md-6">
                  <label for="bookTitle" class="form-label fw-semibold">Book Title <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="bookTitle" placeholder="Enter book title" required>
                </div>
                
                <!-- Author Name -->
                <div class="col-md-6">
                  <label for="bookAuthor" class="form-label fw-semibold">Author Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="bookAuthor" placeholder="Who wrote this book?" required>
                </div>

                <!-- Category -->
                <div class="col-md-6">
                  <label for="bookCategory" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                  <select class="form-select" id="bookCategory" required>
                    <option value="" selected disabled>Select Category...</option>
                    <option value="fiction">Fiction</option>
                    <option value="poetry">Poetry</option>
                    <option value="education">Educational</option>
                    <option value="history">History & Culture</option>
                    <option value="children">Children's Books</option>
                  </select>
                </div>

                <!-- Language -->
                <div class="col-md-6">
                  <label for="bookLanguage" class="form-label fw-semibold">Language <span class="text-danger">*</span></label>
                  <select class="form-select" id="bookLanguage" required>
                    <option value="santali" selected>Santali (Ol Chiki)</option>
                    <option value="santali_latin">Santali (Latin)</option>
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                    <option value="odia">Odia</option>
                    <option value="bengali">Bengali</option>
                  </select>
                </div>
              </div>

              
        
              <h5 class="fw-bold mb-4 border-bottom pb-2 mt-5">Files & Media</h5>

              <div class="row g-4 mb-4">
                <!-- Cover Image Upload -->
                <div class="col-md-6">
                  <span class="form-label fw-semibold d-block mb-2">Book Cover Image <span class="text-danger">*</span></span>
                  <label class="file-drop-area d-block w-100" for="coverImage">
                    <i class="fa-regular fa-image fs-1 text-secondary mb-2"></i>
                    <p class="mb-1 fw-bold">Click to upload cover</p>
                    <p class="small text-muted mb-0">JPG, PNG (Max 2MB)</p>
                    <input type="file" id="coverImage" class="d-none" accept="image/png, image/jpeg" required>
                  </label>
                  <div id="coverFileName" class="small text-success mt-2 fw-semibold"></div>
                </div>

                <!-- PDF File Upload -->
                <div class="col-md-6">
                  <span class="form-label fw-semibold d-block mb-2">Book File (PDF) <span class="text-danger">*</span></span>
                  <label class="file-drop-area d-block w-100" for="bookPdf">
                    <i class="fa-solid fa-file-pdf fs-1 text-danger mb-2"></i>
                    <p class="mb-1 fw-bold">Click to upload PDF</p>
                    <p class="small text-muted mb-0">PDF only (Max 20MB)</p>
                    <input type="file" id="bookPdf" class="d-none" accept="application/pdf" required>
                  </label>
                  <div id="pdfFileName" class="small text-success mt-2 fw-semibold"></div>
                </div>
              </div>

              <h5 class="fw-bold mb-4 border-bottom pb-2 mt-5">Pricing & Description</h5>

              <div class="row g-3 mb-4">
                <!-- Pricing Structure -->
                <div class="col-md-6">
                  <label for="bookPricing" class="form-label fw-semibold">Pricing <span class="text-danger">*</span></label>
                  <select class="form-select" id="bookPricing" required>
                    <option value="free" selected>Free to Read</option>
                    <option value="paid">Paid</option>
                  </select>
                </div>
                
                <!-- Price Amount (Hidden by default, shown if Paid is selected) -->
                <div class="col-md-6 d-none" id="priceAmountDiv">
                  <label for="bookPrice" class="form-label fw-semibold">Price (₹)</label>
                  <input type="number" class="form-control" id="bookPrice" placeholder="e.g. 150" min="1">
                </div>

                <!-- Description -->
                <div class="col-12 mt-3">
                  <label for="bookDescription" class="form-label fw-semibold">Book Description / Summary <span class="text-danger">*</span></label>
                  <textarea class="form-control" id="bookDescription" rows="4" placeholder="Write a brief summary of the book..." required></textarea>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="text-end mt-4">
                <button type="submit" class="btn btn-warning fw-bold px-5 py-2 text-dark shadow-sm">
                  <i class="fa-solid fa-upload me-2"></i> Publish Book
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-teal text-center mt-auto py-3" style="background-color: #005f73;">
    <div class="container">
      <p class="mb-1 fw-bold text-white">&copy; 2026 Santali Digital Library</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase Auth Integration -->
  <script type="module" src="assets/js/auth.js"></script>

  <!-- Mini Script for Form Interactivity (File Names & Pricing) -->
  <!-- Complete Upload & Interactivity Script -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =========================================================
    // ⚠️ REPLACE THESE WITH YOUR ACTUAL SUPABASE KEYS
    // =========================================================
    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
      
      // --- 1. Form Interactivity (File Names & Pricing) ---
      document.getElementById('coverImage').addEventListener('change', function(e) {
        if(this.files[0]) document.getElementById('coverFileName').innerText = "Selected: " + this.files[0].name;
      });
      
      document.getElementById('bookPdf').addEventListener('change', function(e) {
        if(this.files[0]) document.getElementById('pdfFileName').innerText = "Selected: " + this.files[0].name;
      });

      const pricingSelect = document.getElementById('bookPricing');
      const priceDiv = document.getElementById('priceAmountDiv');
      
      pricingSelect.addEventListener('change', function() {
        if (this.value === 'paid') {
          priceDiv.classList.remove('d-none');
          document.getElementById('bookPrice').setAttribute('required', 'true');
        } else {
          priceDiv.classList.add('d-none');
          document.getElementById('bookPrice').removeAttribute('required');
        }
      });

      // --- 2. Handle Form Submission (Upload to Supabase) ---
      const uploadForm = document.getElementById("uploadBookForm");
      
      uploadForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Change button text to show loading state
        const submitBtn = uploadForm.querySelector("button[type='submit']");
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Uploading... Please wait';
        submitBtn.disabled = true;

        try {
          // Verify user is logged in
          const { data: { user }, error: userError } = await supabase.auth.getUser();
          if (userError || !user) throw new Error("You must be logged in to publish a book.");

          // Get form values
          const title = document.getElementById("bookTitle").value.trim();
          const author = document.getElementById("bookAuthor").value.trim();
          const category = document.getElementById("bookCategory").value;
          const language = document.getElementById("bookLanguage").value;
          const pricing = document.getElementById("bookPricing").value;
          const description = document.getElementById("bookDescription").value.trim();
          
          let price = 0;
          if (pricing === "paid") {
            price = parseFloat(document.getElementById("bookPrice").value) || 0;
          }

          const coverFile = document.getElementById("coverImage").files[0];
          const pdfFile = document.getElementById("bookPdf").files[0];

          if (!coverFile || !pdfFile) throw new Error("Please select both a cover image and a PDF file.");

          // Generate unique file names to prevent overwriting (uses timestamp)
          const coverName = `${user.id}-${Date.now()}-${coverFile.name.replace(/\s+/g, '_')}`;
          const pdfName = `${user.id}-${Date.now()}-${pdfFile.name.replace(/\s+/g, '_')}`;

          // Upload Cover Image
          const { error: coverError } = await supabase.storage
            .from('book_covers')
            .upload(coverName, coverFile);
          if (coverError) throw new Error("Failed to upload cover image.");

          // Upload PDF
          const { error: pdfError } = await supabase.storage
            .from('book_pdfs')
            .upload(pdfName, pdfFile);
          if (pdfError) throw new Error("Failed to upload PDF file.");

          // Get Public URLs for the uploaded files
          const { data: coverUrlData } = supabase.storage.from('book_covers').getPublicUrl(coverName);
          const { data: pdfUrlData } = supabase.storage.from('book_pdfs').getPublicUrl(pdfName);

          // Save everything into the 'books' database table
          const { error: dbError } = await supabase
            .from('books')
            .insert([{
                uploader_id: user.id,
                title: title,
                author: author,
                category: category,
                language: language,
                pricing: pricing,
                price: price,
                description: description,
                cover_url: coverUrlData.publicUrl,
                pdf_url: pdfUrlData.publicUrl
            }]);

          if (dbError) throw dbError;

          // Success Message & Reset Form
          alert("🎉 Book published successfully!");
          uploadForm.reset();
          document.getElementById('coverFileName').innerText = "";
          document.getElementById('pdfFileName').innerText = "";
          priceDiv.classList.add('d-none');

        } catch (error) {
          console.error("Upload Error:", error);
          alert("Error: " + error.message);
        } finally {
          // Restore button state
          submitBtn.innerHTML = originalBtnText;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
