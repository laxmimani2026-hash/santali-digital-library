<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Santali Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; display: flex; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Sidebar Styling */
    .sidebar { width: 260px; background-color: #0f172a; color: white; padding-top: 20px; flex-shrink: 0; transition: all 0.3s ease; }
    .sidebar a { color: #cbd5e1; text-decoration: none; padding: 15px 20px; display: block; font-weight: 500; transition: 0.2s; border-left: 4px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background-color: #1e293b; color: #38bdf8; border-left: 4px solid #38bdf8; }
    
    /* Main Content */
    .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; background-color: #f1f5f9; }
    .stat-card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: white; }
    
    /* Table Styling */
    .table-hover tbody tr:hover { background-color: #f8fafc; }
    .book-cover-thumb { width: 40px; height: 55px; object-fit: cover; border-radius: 4px; background-color: #e2e8f0; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column shadow">
    <h5 class="text-center fw-bold mb-4 text-white pb-3 border-bottom border-secondary mx-3">
      <i class="fa-solid fa-shield-halved text-info me-2"></i>Admin Panel
    </h5>
    
    <a href="#" class="nav-link-item active" data-target="overviewSection">
      <i class="fa-solid fa-chart-pie me-2 w-20px"></i> Dashboard
    </a>
    <a href="#" class="nav-link-item" data-target="booksSection">
      <i class="fa-solid fa-book me-2 w-20px"></i> Manage Books
    </a>
    
    <div class="mt-auto mb-3">
      <a href="#" id="logoutBtn" class="text-danger hover-danger">
        <i class="fa-solid fa-right-from-bracket me-2"></i> Secure Logout
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h3 class="fw-bold text-dark mb-0" id="pageTitle">Dashboard Overview</h3>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm" id="adminEmailDisplay">Loading...</span>
      </div>
    </div>

    <!-- Alert Box -->
    <div id="adminAlert" class="alert d-none shadow-sm" role="alert"></div>

    <!-- ========================================== -->
    <!-- SECTION 1: OVERVIEW -->
    <!-- ========================================== -->
    <div id="overviewSection" class="content-section">
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="card stat-card p-4 text-center">
            <i class="fa-solid fa-book-open text-primary fs-1 mb-2"></i>
            <h2 class="fw-bold mb-0" id="totalBooksCount">...</h2>
            <p class="text-muted small mb-0">Total Books Published</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card p-4 text-center">
            <i class="fa-solid fa-users text-success fs-1 mb-2"></i>
            <h2 class="fw-bold mb-0" id="totalUsersCount">...</h2>
            <p class="text-muted small mb-0">Total Registered Users</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card p-4 text-center">
            <i class="fa-solid fa-indian-rupee-sign text-warning fs-1 mb-2"></i>
            <h2 class="fw-bold mb-0">Analytics</h2>
            <p class="text-muted small mb-0">Coming Soon</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- SECTION 2: MANAGE BOOKS -->
    <!-- ========================================== -->
    <div id="booksSection" class="content-section d-none">
      <div class="card stat-card p-0 overflow-hidden">
        
        <div class="card-header bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0 text-dark">Library Database</h5>
          <button class="btn btn-sm btn-outline-primary" id="refreshBooksBtn">
            <i class="fa-solid fa-rotate-right me-1"></i> Refresh
          </button>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light text-secondary small">
                <tr>
                  <th class="ps-4">Book Details</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Uploaded</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="adminBooksList">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
                    Loading books...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Supabase & Logic -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      const adminAlert = document.getElementById('adminAlert');
      const adminBooksList = document.getElementById('adminBooksList');
      
      // Elements for Stats
      const totalBooksCount = document.getElementById('totalBooksCount');
      const totalUsersCount = document.getElementById('totalUsersCount');

      function showAlert(msg, type) {
        adminAlert.className = `alert alert-${type} shadow-sm`;
        adminAlert.textContent = msg;
        adminAlert.classList.remove('d-none');
        setTimeout(() => adminAlert.classList.add('d-none'), 5000);
      }

      // ==========================================
      // 1. SECURITY & AUTH CHECK
      // ==========================================
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        window.location.href = "admin-login.html";
        return;
      }

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        window.location.href = "index.html";
        return;
      }

      document.getElementById('adminEmailDisplay').innerText = `Admin: ${session.user.email}`;

      // ==========================================
      // 2. NAVIGATION LOGIC (TABS)
      // ==========================================
      const navLinks = document.querySelectorAll('.nav-link-item');
      const sections = document.querySelectorAll('.content-section');
      const pageTitle = document.getElementById('pageTitle');

      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          
          // Update active styling
          navLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          // Hide all sections, show target
          const targetId = link.getAttribute('data-target');
          sections.forEach(sec => sec.classList.add('d-none'));
          document.getElementById(targetId).classList.remove('d-none');

          // Update Titles and fetch data if needed
          if (targetId === 'overviewSection') {
            pageTitle.textContent = "Dashboard Overview";
            fetchDashboardStats();
          } else if (targetId === 'booksSection') {
            pageTitle.textContent = "Manage Books";
            fetchAdminBooks();
          }
        });
      });

      // ==========================================
      // 3. FETCH & DISPLAY DASHBOARD STATS
      // ==========================================
      async function fetchDashboardStats() {
        try {
          // Get total books count
          const { count: booksCount, error: bError } = await supabase
            .from('books')
            .select('*', { count: 'exact', head: true });
            
          // Get total users count
          const { count: usersCount, error: uError } = await supabase
            .from('profiles')
            .select('*', { count: 'exact', head: true });

          if (bError || uError) throw new Error("Failed to load statistics.");

          totalBooksCount.textContent = booksCount || 0;
          totalUsersCount.textContent = usersCount || 0;

        } catch (err) {
          console.error("Stats Error:", err);
          totalBooksCount.textContent = "-";
          totalUsersCount.textContent = "-";
        }
      }

      // ==========================================
      // 4. FETCH & RENDER BOOKS
      // ==========================================
      async function fetchAdminBooks() {
        adminBooksList.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div> Loading...</td></tr>`;
        
        try {
          const { data: books, error } = await supabase
            .from('books')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;

          if (!books || books.length === 0) {
            adminBooksList.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted fw-semibold">No books found in the database.</td></tr>`;
            return;
          }

          adminBooksList.innerHTML = ''; // Clear loading

          books.forEach(book => {
            const date = new Date(book.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            const priceHtml = (book.price === 0 || book.price === 'free') 
              ? `<span class="badge bg-success bg-opacity-10 text-success border border-success">FREE</span>` 
              : `₹${book.price}`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="ps-4">
                <div class="d-flex align-items-center">
                  <img src="${book.cover_url || 'https://via.placeholder.com/40x55'}" class="book-cover-thumb me-3" alt="Cover">
                  <div>
                    <h6 class="fw-bold mb-1 text-dark">${book.title}</h6>
                    <small class="text-muted">By ${book.author}</small>
                  </div>
                </div>
              </td>
              <td><span class="badge bg-secondary">${book.category || 'General'}</span></td>
              <td class="fw-semibold">${priceHtml}</td>
              <td class="text-muted small">${date}</td>
              <td class="text-end pe-4">
                <a href="book-details.html?id=${book.id}" target="_blank" class="btn btn-sm btn-outline-primary me-1" title="View Book">
                  <i class="fa-solid fa-eye"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger delete-book-btn" data-id="${book.id}" title="Delete Book">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </td>
            `;
            adminBooksList.appendChild(tr);
          });

          // Attach Delete Listeners
          attachDeleteListeners();

        } catch (err) {
          console.error("Books Fetch Error:", err);
          adminBooksList.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger"><i class="fa-solid fa-circle-exclamation me-2"></i>Failed to load books.</td></tr>`;
        }
      }

      // ==========================================
      // 5. DELETE BOOK LOGIC
      // ==========================================
      function attachDeleteListeners() {
        const deleteBtns = document.querySelectorAll('.delete-book-btn');
        deleteBtns.forEach(btn => {
          btn.addEventListener('click', async function() {
            const bookId = this.getAttribute('data-id');
            
            // Professional confirmation dialog
            const confirmDelete = confirm("Are you sure you want to permanently delete this book? This action cannot be undone.");
            if (!confirmDelete) return;

            // Change button state
            const originalHtml = this.innerHTML;
            this.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;
            this.disabled = true;

            try {
              const { error } = await supabase
                .from('books')
                .delete()
                .eq('id', bookId);

              if (error) {
                // If it fails (often due to users already buying it/foreign key constraint), throw error
                throw new Error(error.message);
              }

              showAlert("Book successfully deleted from the library.", "success");
              fetchAdminBooks(); // Refresh list
              fetchDashboardStats(); // Update totals

            } catch (err) {
              console.error("Delete Error:", err);
              showAlert("Cannot delete book. It may be attached to existing user orders.", "danger");
              this.innerHTML = originalHtml;
              this.disabled = false;
            }
          });
        });
      }

      // Refresh Button Listener
      document.getElementById('refreshBooksBtn').addEventListener('click', fetchAdminBooks);

      // Handle Logout
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        window.location.href = "admin-login.html";
      });

      // Initialize default view
      fetchDashboardStats();
    });
  </script>
</body>
</html>
