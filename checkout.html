<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body { background-color: #f8f9fa; }
    .checkout-card { border: none; border-radius: 12px; }
    .payment-method { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.2s; }
    .payment-method:hover { border-color: #005f73; background-color: #f1f5f9; }
    .payment-method input[type="radio"] { margin-right: 10px; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
      <div class="ms-auto text-white fw-bold">
        <i class="fa-solid fa-lock me-2 text-warning"></i>Secure Checkout
      </div>
    </div>
  </nav>

  <!-- Checkout Container -->
  <div class="container my-5 flex-grow-1">
    
    <div id="checkoutAlert" class="alert d-none shadow-sm mb-4" role="alert"></div>

    <div class="row g-4">
      
      <!-- Left Column: Billing & Payment -->
      <div class="col-lg-8">
        <form id="checkoutForm">
          
          <!-- Billing Details -->
          <div class="card shadow-sm checkout-card mb-4">
            <div class="card-body p-4 p-md-5">
              <h4 class="fw-bold mb-4 border-bottom pb-2">1. Billing Details</h4>
              
              <div class="row g-3">
                <div class="col-md-12">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" class="form-control" id="checkoutName" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Email Address</label>
                  <input type="email" class="form-control bg-light" id="checkoutEmail" readonly>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Phone Number</label>
                  <input type="tel" class="form-control" id="checkoutPhone" required>
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold">Billing Address</label>
                  <textarea class="form-control" id="checkoutAddress" rows="3" required></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Payment Options -->
          <div class="card shadow-sm checkout-card mb-4">
            <div class="card-body p-4 p-md-5">
              <h4 class="fw-bold mb-4 border-bottom pb-2">2. Payment Method</h4>
              
              <div class="d-flex flex-column gap-3">
                <label class="payment-method d-flex align-items-center">
                  <input type="radio" name="paymentType" value="upi" checked>
                  <i class="fa-brands fa-google-pay fs-4 mx-2 text-primary"></i>
                  <span class="fw-semibold">UPI / Google Pay / PhonePe</span>
                </label>
                
                <label class="payment-method d-flex align-items-center">
                  <input type="radio" name="paymentType" value="card">
                  <i class="fa-solid fa-credit-card fs-4 mx-2 text-secondary"></i>
                  <span class="fw-semibold">Credit / Debit Card</span>
                </label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm" id="placeOrderBtn" disabled>
            <i class="fa-solid fa-shield-check me-2"></i>Place Order
          </button>
        </form>
      </div>

      <!-- Right Column: Order Summary -->
      <div class="col-lg-4">
        <div class="card shadow-sm checkout-card sticky-top" style="top: 80px;">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-4 border-bottom pb-2">Order Summary</h4>
            
            <div id="orderItemsContainer">
              <div class="text-center py-4" id="orderLoading">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 small text-muted">Calculating...</p>
              </div>
              <ul class="list-group list-group-flush mb-3 d-none" id="orderList">
                <!-- Items injected by JS -->
              </ul>
            </div>

            <div class="border-top pt-3 mt-3">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span class="fw-semibold" id="checkoutSubtotal">₹0</span>
              </div>
              <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                <span class="text-muted">Tax</span>
                <span class="text-success">₹0</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="fw-bold fs-4">Total</span>
                <span class="fw-bold fs-4 text-primary" id="checkoutTotal">₹0</span>
              </div>
            </div>
            
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Checkout Logic -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const singleBookId = urlParams.get('id'); // Will exist if coming from "Buy Now"

      const checkoutAlert = document.getElementById('checkoutAlert');
      const orderList = document.getElementById('orderList');
      const orderLoading = document.getElementById('orderLoading');
      const checkoutSubtotal = document.getElementById('checkoutSubtotal');
      const checkoutTotal = document.getElementById('checkoutTotal');
      const placeOrderBtn = document.getElementById('placeOrderBtn');
      const checkoutForm = document.getElementById('checkoutForm');

      let orderTotalPrice = 0;
      let isCartCheckout = !singleBookId;

      function showAlert(message, type) {
        checkoutAlert.className = `alert alert-${type} shadow-sm mb-4`;
        checkoutAlert.textContent = message;
        checkoutAlert.classList.remove('d-none');
        window.scrollTo(0, 0);
      }

      try {
        // 1. Authenticate User
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = "login.html";
          return;
        }

        // 2. Pre-fill User Data from Profile
        document.getElementById('checkoutEmail').value = session.user.email;
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
        if (profile) {
          document.getElementById('checkoutName').value = profile.full_name || '';
          document.getElementById('checkoutPhone').value = profile.phone || '';
          document.getElementById('checkoutAddress').value = profile.address || '';
        }

        // 3. Fetch Items (Either single book OR whole cart)
        let booksToRender = [];

        if (singleBookId) {
          // Scenario A: "Buy Now" (Single Book)
          const { data: book, error } = await supabase.from('books').select('*').eq('id', singleBookId).single();
          if (error) throw error;
          booksToRender.push(book);
        } else {
          // Scenario B: Cart Checkout
          const { data: cartData, error: cartError } = await supabase.from('cart_items').select('book_id').eq('user_id', session.user.id);
          if (cartError) throw cartError;
          
          if (!cartData || cartData.length === 0) {
            showAlert("Your cart is empty.", "warning");
            orderLoading.classList.add('d-none');
            return;
          }

          const bookIds = cartData.map(item => item.book_id);
          const { data: booksData, error: booksError } = await supabase.from('books').select('*').in('id', bookIds);
          if (booksError) throw booksError;
          booksToRender = booksData;
        }

        // 4. Render Order Summary
        orderLoading.classList.add('d-none');
        orderList.classList.remove('d-none');

        booksToRender.forEach(book => {
          const price = book.price || 0;
          orderTotalPrice += price;

          const li = document.createElement('li');
          li.className = "list-group-item d-flex justify-content-between lh-sm px-0 py-3";
          li.innerHTML = `
            <div>
              <h6 class="my-0 fw-bold text-truncate" style="max-width: 200px;" title="${book.title}">${book.title}</h6>
              <small class="text-muted">By ${book.author}</small>
            </div>
            <span class="text-muted fw-semibold">₹${price}</span>
          `;
          orderList.appendChild(li);
        });

        // Update Price Totals
        checkoutSubtotal.innerText = `₹${orderTotalPrice}`;
        checkoutTotal.innerText = `₹${orderTotalPrice}`;
        placeOrderBtn.disabled = false;

        // 5. Handle Order Placement
        checkoutForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          placeOrderBtn.disabled = true;
          placeOrderBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...`;

          try {
            // Simulate Payment Processing Delay (Standard for UIs)
            await new Promise(resolve => setTimeout(resolve, 2000));

            // --- NEW: SAVE THE ORDER TO THE DATABASE ---
            const newOrders = booksToRender.map(book => ({
              user_id: session.user.id,
              book_id: book.id,
              amount: book.price || 0,
              status: 'completed'
            }));

            // Insert the purchased books into the 'orders' table
            const { error: insertError } = await supabase.from('orders').insert(newOrders);
            
            if (insertError) throw insertError;
            // -------------------------------------------

            // If this was a cart checkout, clear the user's cart now that they bought it
            if (isCartCheckout) {
               await supabase.from('cart_items').delete().eq('user_id', session.user.id);
            }

            // Show Success & Redirect
            showAlert("Payment successful! Your order has been placed.", "success");
            
            setTimeout(() => {
              // Redirect directly to the orders page so they can see their new book!
              window.location.href = "orders.html"; 
            }, 2000);

          } catch (err) {
             console.error("Order Insert Error:", err);
             showAlert("Payment processed, but failed to save order details. Please contact support.", "danger");
             placeOrderBtn.disabled = false;
             placeOrderBtn.innerHTML = `<i class="fa-solid fa-shield-check me-2"></i>Place Order`;
          }
        });

      } catch (err) {
        console.error("Checkout Error:", err);
        showAlert("Failed to load checkout details. Please try again.", "danger");
        orderLoading.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
