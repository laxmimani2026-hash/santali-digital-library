<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mode | Santali Digital Library</title>
  
  <!-- Google Fonts: Standard + Ol Chiki -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Georgia&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- EPUB.js & JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  
  <style>
    :root {
      --brand-primary: #5c4bca;
      --brand-light: #f3f0ff;
      --topbar-bg: #151623;
      --topbar-text: #ffffff;
      --panel-bg: #ffffff;
      --center-bg: #f5f6f8;
      --text-main: #2b2f38;
      --text-muted: #6c757d;
      --border-color: #e5e7eb;
      --card-bg: #f8f9fa;
      --epub-bg: #ffffff;
      --epub-text: #1f2937;
    }

    body.dark-ui {
      --topbar-bg: #0d0e15;
      --panel-bg: #181924;
      --center-bg: #11121a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #26293b;
      --brand-light: #252243;
      --card-bg: #1f2130;
      --epub-bg: #181924;
      --epub-text: #e2e8f0;
    }

    body.sepia-ui {
      --epub-bg: #fbf0d9;
      --epub-text: #5f4b32;
    }

    * { box-sizing: border-box; }
    
    body {
      background-color: var(--panel-bg);
      color: var(--text-main);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .top-navbar {
      background-color: var(--topbar-bg);
      color: var(--topbar-text);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      flex-shrink: 0;
      z-index: 1030;
    }

    .progress-bar-container {
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-primary);
      transition: width 0.3s ease;
    }

    .app-body { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

    /* Sidebars */
    .sidebar {
      width: 300px;
      background-color: var(--panel-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 1020;
    }

    .left-sidebar { border-right: 1px solid var(--border-color); }
    .right-sidebar { border-left: 1px solid var(--border-color); padding: 1.25rem; }

    .book-cover-container { padding: 1.5rem 1rem; text-align: center; }
    .cover-wrapper { 
      width: 120px; 
      height: 170px; 
      margin: 0 auto 12px; 
      border-radius: 6px; 
      overflow: hidden; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    /* Workspace */
    .center-workspace {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--center-bg);
      position: relative;
      overflow: hidden;
    }

    .reader-container { 
      flex-grow: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 1rem;
    }
    
    #epub-viewer { 
      width: 100%; 
      max-width: 900px; 
      height: 100%; 
      background: var(--epub-bg); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border-radius: 8px; 
      overflow: hidden;
    }

    #pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
    }
    .nav-btn:hover { background: rgba(0,0,0,0.75); transform: translateY(-50%) scale(1.05); }
    .nav-btn.prev { left: 1.5rem; }
    .nav-btn.next { right: 1.5rem; }

    .control-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
    .custom-select, .form-control {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-main);
    }
    .custom-select:focus, .form-control:focus {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-color: var(--brand-primary);
      box-shadow: none;
    }

    /* Responsive Drawer behaviors */
    @media (max-width: 991.98px) {
      .left-sidebar, .right-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        height: 100%;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
      }
      .left-sidebar { left: -320px; }
      .left-sidebar.show { left: 0; }
      .right-sidebar { right: -340px; }
      .right-sidebar.show { right: 0; }
      .nav-btn { width: 36px; height: 36px; }
      .nav-btn.prev { left: 0.5rem; }
      .nav-btn.next { right: 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="top-navbar position-relative">
    <div class="d-flex align-items-center gap-2">
      <a href="browse.html" class="btn btn-sm btn-outline-light border-0" id="backToLibraryBtn">
        <i class="fa-solid fa-arrow-left me-1"></i> <span class="d-none d-sm-inline">Library</span>
      </a>
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleLeftDrawerBtn">
        <i class="fa-solid fa-book-open"></i>
      </button>
    </div>

    <div class="text-center px-2 text-truncate" style="max-width: 50%;">
      <h1 id="topBookTitle" class="fs-6 m-0 fw-bold text-truncate text-white">Loading...</h1>
      <small class="text-white-50" id="topPageIndicator">Page <span id="topPageNum">-</span> of <span id="topTotalPages">-</span></small>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light border-0" id="topDarkModeBtn" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleRightDrawerBtn">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="readingProgressBar"></div>
    </div>
  </nav>

  <div class="app-body">
    <!-- Left Metadata Sidebar -->
    <aside class="sidebar left-sidebar" id="leftSidebar">
      <div class="book-cover-container">
        <div class="cover-wrapper">
          <img id="sidebarCover" src="https://placehold.co/130x180/5c4bca/ffffff?text=eBook" alt="Book Cover">
        </div>
        <h2 id="sidebarTitle" class="fs-6 fw-bold mb-1 text-truncate">Title</h2>
        <p id="sidebarAuthor" class="small text-muted mb-2">Author</p>
        <span class="badge bg-secondary" id="sidebarFormatBadge">EPUB</span>
      </div>
      <div id="sidebarDynamicPanel" class="p-3 border-top">
        <div class="control-label">Description</div>
        <div id="sidebarPanelContent" class="small text-muted" style="line-height: 1.5;">Loading details...</div>
      </div>
    </aside>

    <!-- Workspace / Viewports -->
    <main class="center-workspace">
      <div class="reader-container" id="readerContainer">
        <!-- Floating Controls -->
        <button class="nav-btn prev d-none" id="prevPageBtn" aria-label="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-btn next d-none" id="nextPageBtn" aria-label="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        
        <!-- EPUB Element Container -->
        <div id="epub-viewer"></div>

        <!-- PDF Element (IFrame / PDF Viewer fallback) -->
        <iframe id="pdf-viewer-frame" class="d-none" title="PDF Document Viewer"></iframe>
      </div>
    </main>

    <!-- Right Settings Sidebar -->
    <aside class="sidebar right-sidebar" id="rightSidebar">
      <h6 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
        <span>Settings</span>
        <button class="btn btn-sm btn-close d-lg-none" id="closeRightSidebar"></button>
      </h6>

      <div class="mb-3">
        <div class="control-label">Font Family</div>
        <select class="form-select form-select-sm custom-select" id="fontFamilySelect">
          <option value="Lora" selected>Lora (Serif)</option>
          <option value="Noto Sans Ol Chiki">Ol Chiki (ᱚᱞ ᱪᱤᱠᱤ)</option>
          <option value="Merriweather">Merriweather</option>
          <option value="Georgia">Georgia</option>
          <option value="Open Sans">Open Sans (Sans-Serif)</option>
          <option value="Roboto">Roboto</option>
        </select>
      </div>

      <div class="mb-3">
        <div class="control-label">Font Size</div>
        <div class="input-group input-group-sm">
          <button class="btn btn-outline-secondary" id="fontSizeDecBtn"><i class="fa-solid fa-minus"></i></button>
          <input type="text" class="form-control text-center" id="fontSizeLabel" value="100%" readonly>
          <button class="btn btn-outline-secondary" id="fontSizeIncBtn"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div class="mb-3">
        <div class="control-label">Page Spread</div>
        <div class="btn-group btn-group-sm w-100" role="group">
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadAuto" autocomplete="off" checked>
          <label class="btn btn-outline-secondary" for="spreadAuto">Auto</label>
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadSingle" autocomplete="off">
          <label class="btn btn-outline-secondary" for="spreadSingle">Single</label>
        </div>
      </div>
    </aside>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    let epubBook = null;
    let epubRendition = null;
    let currentFontSize = 100;
    
    // Anti-fraud engagement metrics
    const sessionStartTime = Date.now();
    const pageTurnTimes = [];
    let validPagesRead = 0;

    // Mobile Sidebar Toggles
    const leftSidebar = document.getElementById('leftSidebar');
    const rightSidebar = document.getElementById('rightSidebar');
    document.getElementById('toggleLeftDrawerBtn')?.addEventListener('click', () => leftSidebar.classList.toggle('show'));
    document.getElementById('toggleRightDrawerBtn')?.addEventListener('click', () => rightSidebar.classList.toggle('show'));
    document.getElementById('closeRightSidebar')?.addEventListener('click', () => rightSidebar.classList.remove('show'));

    // Dark Mode Toggle
    document.getElementById('topDarkModeBtn').addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-ui');
      if (epubRendition) {
        epubRendition.themes.override('color', isDark ? '#e2e8f0' : '#2b2f38');
        epubRendition.themes.override('background', isDark ? '#181924' : '#ffffff');
      }
    });

    // Font Controls
    document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
      if (epubRendition) epubRendition.themes.font(e.target.value);
    });

    document.getElementById('fontSizeIncBtn').addEventListener('click', () => {
      if (currentFontSize < 160) {
        currentFontSize += 10;
        updateFontSize();
      }
    });

    document.getElementById('fontSizeDecBtn').addEventListener('click', () => {
      if (currentFontSize > 70) {
        currentFontSize -= 10;
        updateFontSize();
      }
    });

    function updateFontSize() {
      document.getElementById('fontSizeLabel').value = `${currentFontSize}%`;
      if (epubRendition) epubRendition.themes.fontSize(`${currentFontSize}%`);
    }

    // Spread Controls
    document.getElementById('spreadAuto').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('auto');
    });
    document.getElementById('spreadSingle').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('none');
    });

    async function loadBookData() {
      if (!bookId) {
        alert("No book selected. Returning to library.");
        window.location.href = "browse.html";
        return;
      }

      try {
        let { data: book, error } = await supabase
          .from('books')
          .select('*')
          .eq('book_id', bookId)
          .maybeSingle();

        if (!book && !isNaN(Number(bookId))) {
          const res = await supabase.from('books').select('*').eq('id', bookId).maybeSingle();
          book = res.data;
          error = res.error;
        }

        if (error || !book) {
          throw new Error("Book not found in database.");
        }

        document.getElementById('topBookTitle').textContent = book.title || 'Untitled';
        document.getElementById('sidebarTitle').textContent = book.title || 'Untitled';
        document.getElementById('sidebarAuthor').textContent = book.author ? `By ${book.author}` : 'Unknown Author';
        document.getElementById('sidebarPanelContent').textContent = book.description || 'No description available.';
        document.getElementById('sidebarFormatBadge').textContent = (book.file_type || 'epub').toUpperCase();

        if (book.cover_url) {
          document.getElementById('sidebarCover').src = book.cover_url;
        }

        const fileUrl = book.pdf_url || book.file_url;
        if (!fileUrl) {
          throw new Error("No readable book file is associated with this entry.");
        }

        const format = (book.file_type || '').toLowerCase();
        const isPdf = format === 'pdf' || fileUrl.toLowerCase().endsWith('.pdf');

        if (isPdf) {
          renderPdf(fileUrl);
        } else {
          renderEpub(fileUrl);
        }

      } catch (err) {
        console.error("Reader Error:", err);
        document.getElementById('sidebarPanelContent').innerHTML = `<span class="text-danger">${err.message}</span>`;
      }
    }

    function renderEpub(url) {
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      prevBtn.classList.remove('d-none');
      nextBtn.classList.remove('d-none');

      epubBook = ePub(url);
      epubRendition = epubBook.renderTo("epub-viewer", { 
        width: "100%", 
        height: "100%",
        spread: "auto"
      });

      epubRendition.display();

      const goPrev = () => epubRendition && epubRendition.prev();
      const goNext = () => epubRendition && epubRendition.next();

      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);

      // Keyboard navigation
      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') goPrev();
        if (e.key === 'ArrowRight') goNext();
      });

      epubBook.ready
        .then(() => epubBook.locations.generate(1024))
        .then(() => {
          epubRendition.on('relocated', (location) => {
            const currentCfi = location.start.cfi;
            const currentLoc = epubBook.locations.locationFromCfi(currentCfi) || 1;
            const totalLocs = epubBook.locations.total || 1;
            
            document.getElementById('topPageNum').textContent = currentLoc;
            document.getElementById('topTotalPages').textContent = totalLocs;
            
            const pct = Math.min(100, Math.round((currentLoc / totalLocs) * 100));
            document.getElementById('readingProgressBar').style.width = `${pct}%`;
            
            trackReadingEngagement(currentLoc);
          });
        });
    }

    function renderPdf(url) {
      document.getElementById('epub-viewer').classList.add('d-none');
      document.getElementById('topPageIndicator').classList.add('d-none');
      document.getElementById('rightSidebar').classList.add('d-none');

      const pdfFrame = document.getElementById('pdf-viewer-frame');
      pdfFrame.classList.remove('d-none');
      pdfFrame.src = `${url}#toolbar=1&navpanes=0`;
    }

    function trackReadingEngagement(pageNo) {
      const now = Date.now();
      pageTurnTimes.push(now);

      if (pageTurnTimes.length > 5) {
        const timeFor5Pages = (now - pageTurnTimes[pageTurnTimes.length - 5]) / 1000;
        if (timeFor5Pages < 3) {
          console.warn("Anti-Fraud Alert: Rapid page-turn detected.");
          return;
        }
      }

      validPagesRead++;

      if (validPagesRead % 5 === 0) {
        const durationSec = Math.round((now - sessionStartTime) / 1000);
        supabase.from('reading_analytics').insert([{
          book_id: bookId,
          pages_read: validPagesRead,
          duration_seconds: durationSec,
          is_valid_engagement: true
        }]).then(({ error }) => { 
          if (error) console.error("Activity logging error:", error); 
        });
      }
    }

    document.addEventListener("DOMContentLoaded", loadBookData);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
