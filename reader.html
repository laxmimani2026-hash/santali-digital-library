<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mode | Santali Digital Library</title>
  
  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    /* Professional Theme Variables */
    :root {
      --bg-color: #e9ecef;
      --text-color: #212529;
      --nav-bg: #ffffff;
      --border-color: #ced4da;
      --toolbar-bg: #ffffff;
      --canvas-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --nav-bg: #1e1e1e;
      --border-color: #333333;
      --toolbar-bg: #1a1a1a;
      --canvas-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Top Toolbar */
    .reader-nav {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    /* PDF Viewer Area */
    .pdf-container {
      flex-grow: 1;
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
      position: relative;
    }

    canvas {
      box-shadow: var(--canvas-shadow);
      border-radius: 4px;
      transition: filter 0.3s ease, transform 0.2s ease;
      max-width: 100%; /* Prevents extreme overflow */
    }

    /* Smart Dark Mode for PDF Canvas */
    [data-theme="dark"] canvas {
      filter: invert(90%) hue-rotate(180deg) contrast(90%);
    }

    /* Bottom Reading Controls */
    .reader-controls {
      background-color: var(--toolbar-bg);
      border-top: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Interactive Page Input */
    .page-input {
      width: 60px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--nav-bg);
      color: var(--text-color);
      font-weight: bold;
      padding: 2px 5px;
    }
    
    /* Hide number arrows in input */
    .page-input::-webkit-outer-spin-button,
    .page-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <div class="reader-nav shadow-sm">
    <button class="btn btn-outline-secondary btn-sm fw-semibold" id="backBtn">
      <i class="fa-solid fa-arrow-left me-2"></i> Back
    </button>
    
    <h5 class="mb-0 fw-bold text-truncate mx-3" id="bookTitle">Loading Book...</h5>
    
    <div class="nav-actions">
      <!-- Feature 6: Download -->
      <button class="btn btn-outline-primary btn-sm" id="downloadBtn" title="Download PDF">
        <i class="fa-solid fa-download"></i>
      </button>
      
      <!-- Feature 4: Rotate -->
      <button class="btn btn-outline-secondary btn-sm" id="rotateBtn" title="Rotate Page">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      
      <!-- Feature 1: Fullscreen -->
      <button class="btn btn-outline-secondary btn-sm" id="fullscreenBtn" title="Fullscreen">
        <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
      </button>

      <!-- Theme Toggle -->
      <button class="btn btn-dark btn-sm fw-semibold shadow-sm" id="themeToggle">
        <i class="fa-solid fa-moon me-1"></i> Dark Mode
      </button>
    </div>
  </div>

  <!-- PDF Display Area -->
  <div class="pdf-container" id="pdfContainer">
    <div id="loading" class="text-center my-auto">
       <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
       <h5 class="text-muted" id="loadingText">Preparing your book...</h5>
    </div>
    
    <canvas id="pdf-render" class="d-none"></canvas>
  </div>

  <!-- Bottom Reading Controls -->
  <div class="reader-controls shadow-lg d-none" id="readerControls">
    
    <!-- Zoom Controls & Fit Width -->
    <div class="control-group">
      <button class="btn btn-outline-secondary btn-sm" id="zoomOut" title="Zoom Out">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <span class="fw-semibold small mx-1 text-center" style="width: 45px;" id="zoomVal">100%</span>
      <button class="btn btn-outline-secondary btn-sm" id="zoomIn" title="Zoom In">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <!-- Feature 5: Fit to Width -->
      <button class="btn btn-outline-secondary btn-sm ms-2" id="fitWidthBtn" title="Fit to Width">
        <i class="fa-solid fa-arrows-left-right"></i> Fit
      </button>
    </div>

    <!-- Feature 3: Jump to Page & Pagination -->
    <div class="control-group">
      <button class="btn btn-primary btn-sm" id="prevPage">
        <i class="fa-solid fa-chevron-left me-1"></i> Prev
      </button>
      
      <span class="fw-bold mx-2 small d-flex align-items-center gap-2">
        Page 
        <input type="number" id="pageInput" class="page-input" value="0" min="1"> 
        of <span id="pageCount">0</span>
      </span>
      
      <button class="btn btn-primary btn-sm" id="nextPage">
        Next <i class="fa-solid fa-chevron-right ms-1"></i>
      </button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =========================================================
    // SUPABASE SETUP
    // =========================================================
    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Get Book ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // =========================================================
    // UI BEHAVIORS & NEW FEATURES
    // =========================================================
    
    // Smart Back Button
    document.getElementById('backBtn').addEventListener('click', () => {
      if (window.history.length > 2) {
        window.history.back();
      } else {
        window.location.href = 'browse.html'; // Fallback route
      }
    });

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
        themeToggle.innerHTML = '<i class="fa-solid fa-moon me-1"></i> Dark Mode';
        themeToggle.className = 'btn btn-dark btn-sm fw-semibold shadow-sm';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fa-solid fa-sun me-1"></i> Light Mode';
        themeToggle.className = 'btn btn-light btn-sm fw-semibold text-dark shadow-sm';
      }
    });

    // Fullscreen Toggle
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fullscreenIcon = document.getElementById('fullscreenIcon');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
        fullscreenIcon.classList.replace('fa-expand', 'fa-compress');
      } else {
        document.exitFullscreen();
        fullscreenIcon.classList.replace('fa-compress', 'fa-expand');
      }
    });

    // Download PDF (Initialized later when URL is fetched)
    let activePdfUrl = "";
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if(activePdfUrl) {
        const a = document.createElement('a');
        a.href = activePdfUrl;
        a.download = document.getElementById('bookTitle').innerText + ".pdf";
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    });


    // =========================================================
    // PDF.js VIEWER LOGIC
    // =========================================================
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumPending = null,
        scale = 1.0, 
        rotation = 0, // Feature: Rotation tracking
        canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d'),
        pageInput = document.getElementById('pageInput');

    // Render the page
    const renderPage = (num) => {
      pageIsRendering = true;

      pdfDoc.getPage(num).then((page) => {
        // Apply zoom and rotation
        const viewport = page.getViewport({ scale, rotation });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        // Update Page Input Value
        pageInput.value = num;
        
        // Scroll to top of container when page changes
        document.getElementById('pdfContainer').scrollTop = 0;
      });
    };

    const queueRenderPage = (num) => {
      if (pageIsRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    };

    // Pagination Controls
    document.getElementById('prevPage').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    // Jump to Page (Enter key trigger)
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let desiredPage = parseInt(pageInput.value);
        if (desiredPage >= 1 && desiredPage <= pdfDoc.numPages) {
          pageNum = desiredPage;
          queueRenderPage(pageNum);
        } else {
          pageInput.value = pageNum; // Reset if invalid
        }
      }
    });

    // Zoom Controls
    const updateZoomDisplay = () => {
      document.getElementById('zoomVal').textContent = `${Math.round(scale * 100)}%`;
    }

    document.getElementById('zoomIn').addEventListener('click', () => {
      if (scale >= 3.0) return; 
      scale += 0.25;
      updateZoomDisplay();
      queueRenderPage(pageNum);
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      if (scale <= 0.5) return; 
      scale -= 0.25;
      updateZoomDisplay();
      queueRenderPage(pageNum);
    });

    // Rotate Feature
    document.getElementById('rotateBtn').addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      queueRenderPage(pageNum);
    });

    // Fit to Width Feature
    document.getElementById('fitWidthBtn').addEventListener('click', () => {
      pdfDoc.getPage(pageNum).then((page) => {
        const unscaledViewport = page.getViewport({ scale: 1, rotation });
        const containerWidth = document.getElementById('pdfContainer').clientWidth;
        // Subtract 60px to account for container padding
        scale = (containerWidth - 60) / unscaledViewport.width; 
        updateZoomDisplay();
        queueRenderPage(pageNum);
      });
    });

    // =========================================================
    // FETCH AND INITIALIZE PDF
    // =========================================================
    document.addEventListener("DOMContentLoaded", async () => {
      if (!bookId) {
        document.getElementById('bookTitle').innerText = "Error: No book selected";
        document.getElementById('loadingText').innerHTML = "<span class='text-danger'>Invalid link.</span>";
        return;
      }

      try {
        const { data: book, error } = await supabase
          .from('books')
          .select('title, pdf_url')
          .eq('id', bookId)
          .single();

        if (error || !book) throw error;
        
        document.getElementById('bookTitle').innerText = book.title;
        activePdfUrl = book.pdf_url; // Store for download button

        const loadingTask = pdfjsLib.getDocument(activePdfUrl);
        
        loadingTask.promise.then((pdfDoc_) => {
          pdfDoc = pdfDoc_;
          
          document.getElementById('pageCount').textContent = pdfDoc.numPages;
          pageInput.max = pdfDoc.numPages;
          
          // Hide Loading, Show Canvas & Controls
          document.getElementById('loading').classList.add('d-none');
          canvas.classList.remove('d-none');
          document.getElementById('readerControls').classList.remove('d-none');
          document.getElementById('readerControls').classList.add('d-flex');
          
          renderPage(pageNum);

        }).catch(err => {
          console.error("PDF Loading Error:", err);
          document.getElementById('loadingText').innerHTML = "<span class='text-danger'>Failed to render the PDF file.</span>";
        });
        
      } catch (error) {
        console.error("Supabase Fetch Error:", error);
        document.getElementById('loadingText').innerHTML = "<span class='text-danger'>Failed to load the book details.</span>";
      }
    });
  </script>
</body>
</html>
