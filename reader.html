<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mode | Santali Digital Library</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Georgia&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  
  <style>
    :root {
      --brand-primary: #5c4bca;
      --brand-light: #f3f0ff;
      --topbar-bg: #151623;
      --topbar-text: #ffffff;
      --panel-bg: #ffffff;
      --center-bg: #f5f6f8;
      --text-main: #2b2f38;
      --text-muted: #6c757d;
      --border-color: #e5e7eb;
      --card-bg: #f8f9fa;
      --epub-bg: #ffffff;
      --epub-text: #1f2937;
    }

    body.dark-ui {
      --topbar-bg: #0d0e15;
      --panel-bg: #181924;
      --center-bg: #11121a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #26293b;
      --brand-light: #252243;
      --card-bg: #1f2130;
      --epub-bg: #181924;
      --epub-text: #e2e8f0;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    
    body {
      background-color: var(--panel-bg);
      color: var(--text-main);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .top-navbar {
      background-color: var(--topbar-bg);
      color: var(--topbar-text);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      flex-shrink: 0;
      z-index: 1030;
    }

    .progress-bar-container {
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-primary);
      transition: width 0.3s ease;
    }

    .app-body { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

    .sidebar {
      width: 300px;
      background-color: var(--panel-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 1020;
    }

    .left-sidebar { border-right: 1px solid var(--border-color); }
    .right-sidebar { border-left: 1px solid var(--border-color); padding: 1.25rem; }

    /* Reader Profile Badge */
    .reader-profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reader-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--brand-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .book-cover-container { padding: 1rem; text-align: center; }
    .cover-wrapper { 
      width: 110px; 
      height: 155px; 
      margin: 0 auto 10px; 
      border-radius: 6px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .center-workspace {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--center-bg);
      position: relative;
      overflow: hidden;
    }

    .reader-container { 
      flex-grow: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 1rem;
    }
    
    #epub-viewer { 
      width: 100%; 
      max-width: 900px; 
      height: 100%; 
      background: var(--epub-bg); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border-radius: 8px; 
      overflow: hidden;
      position: relative;
    }

    /* Edge Click Tap Targets */
    .tap-target {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      z-index: 15;
      cursor: pointer;
    }
    .tap-target.left { left: 0; }
    .tap-target.right { right: 0; }

    #pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    .control-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
    .custom-select, .form-control {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    #loadingOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--center-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    @media (max-width: 991.98px) {
      .left-sidebar, .right-sidebar {
        position: absolute;
        top: 0; bottom: 0; height: 100%;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
      }
      .left-sidebar { left: -320px; }
      .left-sidebar.show { left: 0; }
      .right-sidebar { right: -340px; }
      .right-sidebar.show { right: 0; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <nav class="top-navbar position-relative">
    <div class="d-flex align-items-center gap-2">
      <a href="reader-dashboard.html" class="btn btn-sm btn-outline-light border-0" id="backToLibraryBtn">
        <i class="fa-solid fa-arrow-left me-1"></i> <span class="d-none d-sm-inline">Dashboard</span>
      </a>
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleLeftDrawerBtn">
        <i class="fa-solid fa-book-open"></i>
      </button>
    </div>

    <div class="text-center px-2 text-truncate" style="max-width: 50%;">
      <h1 id="topBookTitle" class="fs-6 m-0 fw-bold text-truncate text-white">Loading...</h1>
      <small class="text-white-50" id="topPageIndicator">Page <span id="topPageNum">-</span> of <span id="topTotalPages">-</span></small>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light border-0" id="topDarkModeBtn" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleRightDrawerBtn">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="readingProgressBar"></div>
    </div>
  </nav>

  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="sidebar left-sidebar" id="leftSidebar">
      <!-- Active Reader Profile Box -->
      <div class="reader-profile-card">
        <div class="reader-avatar" id="userAvatar">U</div>
        <div class="overflow-hidden">
          <div class="fw-bold small text-truncate" id="userName">Checking user...</div>
          <div class="text-muted" style="font-size: 0.72rem;"><i class="fa-solid fa-circle text-success me-1" style="font-size: 0.5rem;"></i>Currently Reading</div>
        </div>
      </div>

      <div class="book-cover-container">
        <div class="cover-wrapper">
          <img id="sidebarCover" src="https://placehold.co/130x180/5c4bca/ffffff?text=eBook" alt="Book Cover">
        </div>
        <h2 id="sidebarTitle" class="fs-6 fw-bold mb-1 text-truncate">Loading...</h2>
        <p id="sidebarAuthor" class="small text-muted mb-2">-</p>
        <span class="badge bg-secondary" id="sidebarFormatBadge">EPUB</span>
      </div>

      <div id="sidebarDynamicPanel" class="p-3 border-top">
        <div class="control-label">Description</div>
        <div id="sidebarPanelContent" class="small text-muted" style="line-height: 1.5;">Fetching details...</div>
      </div>
    </aside>

    <!-- Center Workspace -->
    <main class="center-workspace">
      <div id="loadingOverlay">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="small text-muted" id="loadingStatus">Loading document...</div>
      </div>

      <div class="reader-container" id="readerContainer">
        <!-- Edge click trigger targets -->
        <div class="tap-target left" id="tapLeft" title="Previous Page"></div>
        <div class="tap-target right" id="tapRight" title="Next Page"></div>

        <div id="epub-viewer"></div>
        <iframe id="pdf-viewer-frame" class="d-none" title="PDF Viewer"></iframe>
      </div>
    </main>

    <!-- Right Settings Sidebar -->
    <aside class="sidebar right-sidebar" id="rightSidebar">
      <h6 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
        <span>Settings</span>
        <button class="btn btn-sm btn-close d-lg-none" id="closeRightSidebar"></button>
      </h6>

      <div class="mb-3">
        <div class="control-label">Font Family</div>
        <select class="form-select form-select-sm custom-select" id="fontFamilySelect">
          <option value="Lora" selected>Lora (Serif)</option>
          <option value="Noto Sans Ol Chiki">Ol Chiki (ᱚᱞ ᱪᱤᱠᱤ)</option>
          <option value="Merriweather">Merriweather</option>
          <option value="Georgia">Georgia</option>
          <option value="Open Sans">Open Sans (Sans-Serif)</option>
        </select>
      </div>

      <div class="mb-3">
        <div class="control-label">Font Size</div>
        <div class="input-group input-group-sm">
          <button class="btn btn-outline-secondary" id="fontSizeDecBtn"><i class="fa-solid fa-minus"></i></button>
          <input type="text" class="form-control text-center" id="fontSizeLabel" value="100%" readonly>
          <button class="btn btn-outline-secondary" id="fontSizeIncBtn"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div class="mb-3">
        <div class="control-label">Page Spread</div>
        <div class="btn-group btn-group-sm w-100" role="group">
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadAuto" autocomplete="off" checked>
          <label class="btn btn-outline-secondary" for="spreadAuto">Auto</label>
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadSingle" autocomplete="off">
          <label class="btn btn-outline-secondary" for="spreadSingle">Single</label>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // Copy/Selection Protections
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 'p', 's', 'u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    let epubBook = null;
    let epubRendition = null;
    let currentUser = null;
    let currentResolvedBookId = null;
    let currentFontSize = 100;
    
    const sessionStartTime = Date.now();
    const pageTurnTimes = [];
    let validPagesRead = 0;

    // Mobile Drawers
    const leftSidebar = document.getElementById('leftSidebar');
    const rightSidebar = document.getElementById('rightSidebar');
    document.getElementById('toggleLeftDrawerBtn')?.addEventListener('click', () => leftSidebar.classList.toggle('show'));
    document.getElementById('toggleRightDrawerBtn')?.addEventListener('click', () => rightSidebar.classList.toggle('show'));
    document.getElementById('closeRightSidebar')?.addEventListener('click', () => rightSidebar.classList.remove('show'));

    // Dark Mode
    document.getElementById('topDarkModeBtn').addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-ui');
      if (epubRendition) {
        epubRendition.themes.override('color', isDark ? '#e2e8f0' : '#2b2f38');
        epubRendition.themes.override('background', isDark ? '#181924' : '#ffffff');
      }
    });

    // Font Controls
    document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
      if (epubRendition) epubRendition.themes.font(e.target.value);
    });

    document.getElementById('fontSizeIncBtn').addEventListener('click', () => {
      if (currentFontSize < 160) {
        currentFontSize += 10;
        updateFontSize();
      }
    });

    document.getElementById('fontSizeDecBtn').addEventListener('click', () => {
      if (currentFontSize > 70) {
        currentFontSize -= 10;
        updateFontSize();
      }
    });

    function updateFontSize() {
      document.getElementById('fontSizeLabel').value = `${currentFontSize}%`;
      if (epubRendition) epubRendition.themes.fontSize(`${currentFontSize}%`);
    }

    document.getElementById('spreadAuto').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('auto');
    });
    document.getElementById('spreadSingle').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('none');
    });

    function hideLoader() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    // Initialize User & Profile
    async function initUserSession() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        currentUser = user;
        const { data: profile } = await supabase
          .from('profiles')
          .select('full_name, first_name, username')
          .eq('id', user.id)
          .maybeSingle();

        const name = profile?.full_name || profile?.first_name || profile?.username || user.email.split('@')[0];
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      } else {
        document.getElementById('userName').textContent = "Guest Reader";
        document.getElementById('userAvatar').textContent = "G";
      }
    }

    async function fetchBookRecord(idVal) {
      let { data } = await supabase.from('books').select('*').eq('id', idVal).maybeSingle();
      if (data) return data;

      const res2 = await supabase.from('books').select('*').eq('book_id', idVal).maybeSingle();
      if (res2.data) return res2.data;

      const res3 = await supabase.from('books').select('*').eq('uuid', idVal).maybeSingle();
      if (res3.data) return res3.data;

      return null;
    }

    async function loadBookData() {
      await initUserSession();

      if (!bookId) {
        alert("No book selected. Returning to dashboard.");
        window.location.href = "reader-dashboard.html";
        return;
      }

      try {
        const book = await fetchBookRecord(bookId);

        if (!book) throw new Error("Book not found in database.");
        currentResolvedBookId = book.id;

        const title = book.title || book.book_name || 'Untitled Book';
        const author = book.author || book.author_name || 'Unknown Author';
        const description = book.description || book.summary || 'No description available.';
        const cover = book.cover_url || book.thumbnail_url || book.image_url || 'https://placehold.co/130x180/5c4bca/ffffff?text=eBook';
        const fileUrl = book.file_url || book.pdf_url || book.epub_url || book.download_url || book.book_url;
        const fileType = (book.file_type || book.format || (fileUrl && fileUrl.endsWith('.pdf') ? 'pdf' : 'epub')).toLowerCase();

        document.getElementById('topBookTitle').textContent = title;
        document.getElementById('sidebarTitle').textContent = title;
        document.getElementById('sidebarAuthor').textContent = `By ${author}`;
        document.getElementById('sidebarPanelContent').textContent = description;
        document.getElementById('sidebarFormatBadge').textContent = fileType.toUpperCase();
        document.getElementById('sidebarCover').src = cover;

        if (!fileUrl) throw new Error("No readable book file is associated with this entry.");

        if (fileType === 'pdf' || fileUrl.toLowerCase().endsWith('.pdf')) {
          renderPdf(fileUrl);
        } else {
          renderEpub(fileUrl);
        }

      } catch (err) {
        console.error("Reader Error:", err);
        hideLoader();
        document.getElementById('sidebarPanelContent').innerHTML = `<span class="text-danger">${err.message}</span>`;
        document.getElementById('topBookTitle').textContent = 'Error Loading Book';
      }
    }

    function renderEpub(url) {
      epubBook = ePub(url);
      epubRendition = epubBook.renderTo("epub-viewer", { 
        width: "100%", 
        height: "100%",
        spread: "auto"
      });

      // Disable selection inside EPUB
      epubRendition.themes.default({
        '*': {
          '-webkit-user-select': 'none !important',
          '-moz-user-select': 'none !important',
          '-ms-user-select': 'none !important',
          'user-select': 'none !important'
        }
      });

      const goPrev = () => epubRendition && epubRendition.prev();
      const goNext = () => epubRendition && epubRendition.next();

      // Feature 1: Left/Right edge click handlers
      document.getElementById('tapLeft').addEventListener('click', goPrev);
      document.getElementById('tapRight').addEventListener('click', goNext);

      // Support edge clicks inside the iframe content document
      epubRendition.hooks.content.register((contents) => {
        const doc = contents.document;
        doc.addEventListener('contextmenu', (e) => e.preventDefault());
        doc.addEventListener('copy', (e) => e.preventDefault());
        
        doc.addEventListener('click', (e) => {
          const width = doc.documentElement.clientWidth;
          if (e.clientX < width * 0.3) {
            goPrev();
          } else if (e.clientX > width * 0.7) {
            goNext();
          }
        });
      });

      epubRendition.display().then(() => hideLoader());

      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') goPrev();
        if (e.key === 'ArrowRight') goNext();
      });

      epubBook.ready
        .then(() => epubBook.locations.generate(1024))
        .then(() => {
          epubRendition.on('relocated', (location) => {
            const currentCfi = location.start.cfi;
            const currentLoc = epubBook.locations.locationFromCfi(currentCfi) || 1;
            const totalLocs = epubBook.locations.total || 1;
            
            document.getElementById('topPageNum').textContent = currentLoc;
            document.getElementById('topTotalPages').textContent = totalLocs;
            
            const pct = Math.min(100, Math.round((currentLoc / totalLocs) * 100));
            document.getElementById('readingProgressBar').style.width = `${pct}%`;
            
            trackReadingEngagement(currentLoc, totalLocs, currentCfi);
          });
        });
    }

    function renderPdf(url) {
      hideLoader();
      document.getElementById('epub-viewer').classList.add('d-none');
      document.getElementById('topPageIndicator').classList.add('d-none');
      document.getElementById('rightSidebar').classList.add('d-none');
      document.getElementById('tapLeft').classList.add('d-none');
      document.getElementById('tapRight').classList.add('d-none');

      const pdfFrame = document.getElementById('pdf-viewer-frame');
      pdfFrame.classList.remove('d-none');
      pdfFrame.src = `${url}#toolbar=0&navpanes=0&scrollbar=1`;
    }

    // Sync progress with Supabase for Reader Dashboard
    async function trackReadingEngagement(pageNo, totalPages, cfi) {
      const now = Date.now();
      pageTurnTimes.push(now);

      if (pageTurnTimes.length > 5) {
        const timeFor5Pages = (now - pageTurnTimes[pageTurnTimes.length - 5]) / 1000;
        if (timeFor5Pages < 3) return; // Anti-fraud throttle
      }

      validPagesRead++;

      // Update active reader progress in reading_progress table
      if (currentUser && currentResolvedBookId) {
        try {
          await supabase.from('reading_progress').upsert({
            user_id: currentUser.id,
            book_id: currentResolvedBookId,
            pages_read: pageNo,
            total_pages: totalPages,
            last_location_cfi: cfi,
            last_read_at: new Date().toISOString()
          }, { onConflict: 'user_id,book_id' });
        } catch (e) {
          console.warn("Progress sync error:", e);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", loadBookData);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
