<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mode | Santali Digital Library</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Georgia&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  
  <style>
    :root {
      --brand-primary: #5c4bca;
      --brand-light: #f3f0ff;
      --topbar-bg: #151623;
      --topbar-text: #ffffff;
      --panel-bg: #ffffff;
      --center-bg: #f5f6f8;
      --text-main: #2b2f38;
      --text-muted: #6c757d;
      --border-color: #e5e7eb;
      --card-bg: #f8f9fa;
      --epub-bg: #ffffff;
      --epub-text: #1f2937;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    
    body {
      background-color: var(--panel-bg);
      color: var(--text-main);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .top-navbar {
      background-color: var(--topbar-bg);
      color: var(--topbar-text);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      flex-shrink: 0;
      z-index: 1030;
    }

    .progress-bar-container {
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-primary);
      transition: width 0.3s ease;
    }

    .app-body { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

    .sidebar {
      width: 300px;
      background-color: var(--panel-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: all 0.3s ease;
      z-index: 1020;
    }

    .left-sidebar { border-right: 1px solid var(--border-color); }
    .right-sidebar { border-left: 1px solid var(--border-color); padding: 1.25rem; }

    .reader-profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reader-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--brand-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .book-cover-container { padding: 1rem; text-align: center; }
    .cover-wrapper { 
      width: 110px; 
      height: 155px; 
      margin: 0 auto 10px; 
      border-radius: 6px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .center-workspace {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--center-bg);
      position: relative;
      overflow: hidden;
    }

    .reader-container { 
      flex-grow: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 1rem;
    }
    
    #epub-viewer { 
      width: 100%; 
      max-width: 900px; 
      height: 100%; 
      background: var(--epub-bg); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border-radius: 8px; 
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s ease;
    }

    .tap-target {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 15;
      cursor: pointer;
    }
    .tap-target.left { left: 0; }
    .tap-target.right { right: 0; }

    #pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    .control-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
    .custom-select, .form-control {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    .theme-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ccc;
      transition: transform 0.15s, border-color 0.15s;
    }
    .theme-swatch:hover {
      transform: scale(1.12);
    }
    .theme-swatch.active {
      border-color: var(--brand-primary) !important;
      box-shadow: 0 0 0 3px rgba(92, 75, 202, 0.3);
    }

    #loadingOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--center-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    @media (max-width: 991.98px) {
      .left-sidebar, .right-sidebar {
        position: absolute;
        top: 0; bottom: 0; height: 100%;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
      }
      .left-sidebar { left: -320px; }
      .left-sidebar.show { left: 0; }
      .right-sidebar { right: -340px; }
      .right-sidebar.show { right: 0; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <nav class="top-navbar position-relative">
    <div class="d-flex align-items-center gap-2">
      <a href="reader-dashboard.html" class="btn btn-sm btn-outline-light border-0" id="backToLibraryBtn">
        <i class="fa-solid fa-arrow-left me-1"></i> <span class="d-none d-sm-inline">Dashboard</span>
      </a>
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleLeftDrawerBtn">
        <i class="fa-solid fa-book-open"></i>
      </button>
    </div>

    <div class="text-center px-2 text-truncate" style="max-width: 50%;">
      <h1 id="topBookTitle" class="fs-6 m-0 fw-bold text-truncate text-white">Loading...</h1>
      <small class="text-white-50" id="topPageIndicator">Page <span id="topPageNum">1</span> of <span id="topTotalPages">--</span></small>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light border-0 d-lg-none" id="toggleRightDrawerBtn">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="readingProgressBar"></div>
    </div>
  </nav>

  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="sidebar left-sidebar" id="leftSidebar">
      <div class="reader-profile-card">
        <div class="reader-avatar" id="userAvatar">U</div>
        <div class="overflow-hidden">
          <div class="fw-bold small text-truncate" id="userName">Checking user...</div>
          <div class="text-muted" style="font-size: 0.72rem;"><i class="fa-solid fa-circle text-success me-1" style="font-size: 0.5rem;"></i>Currently Reading</div>
        </div>
      </div>

      <div class="book-cover-container">
        <div class="cover-wrapper">
          <img id="sidebarCover" src="https://placehold.co/130x180/5c4bca/ffffff?text=eBook" alt="Book Cover">
        </div>
        <h2 id="sidebarTitle" class="fs-6 fw-bold mb-1 text-truncate">Loading...</h2>
        <p id="sidebarAuthor" class="small text-muted mb-2">-</p>
        <span class="badge bg-secondary" id="sidebarFormatBadge">EPUB</span>
      </div>

      <div id="sidebarDynamicPanel" class="p-3 border-top">
        <div class="control-label">Description</div>
        <div id="sidebarPanelContent" class="small text-muted" style="line-height: 1.5;">Fetching details...</div>
      </div>
    </aside>

    <!-- Center Workspace -->
    <main class="center-workspace">
      <div id="loadingOverlay">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="small text-muted" id="loadingStatus">Loading document...</div>
      </div>

      <div class="reader-container" id="readerContainer">
        <div class="tap-target left" id="tapLeft" title="Previous Page"></div>
        <div class="tap-target right" id="tapRight" title="Next Page"></div>

        <div id="epub-viewer"></div>
        <iframe id="pdf-viewer-frame" class="d-none" title="PDF Viewer"></iframe>
      </div>
    </main>

    <!-- Right Settings Sidebar -->
    <aside class="sidebar right-sidebar" id="rightSidebar">
      <h6 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
        <span>Settings</span>
        <button class="btn btn-sm btn-close d-lg-none" id="closeRightSidebar"></button>
      </h6>

      <!-- 5 Reading Background Options -->
      <div class="mb-4">
        <div class="control-label">Background Theme</div>
        <div class="d-flex justify-content-between align-items-center p-2 rounded bg-light border">
          <button type="button" class="theme-swatch active" data-bg="#ffffff" data-text="#1f2937" style="background-color: #ffffff;" title="Pure White"></button>
          <button type="button" class="theme-swatch" data-bg="#fbf0d9" data-text="#5f4b32" style="background-color: #fbf0d9;" title="Warm Sepia"></button>
          <button type="button" class="theme-swatch" data-bg="#e8f0fe" data-text="#1a237e" style="background-color: #e8f0fe;" title="Soft Blue"></button>
          <button type="button" class="theme-swatch" data-bg="#2d3748" data-text="#f7fafc" style="background-color: #2d3748;" title="Slate Gray"></button>
          <button type="button" class="theme-swatch" data-bg="#121212" data-text="#e0e0e0" style="background-color: #121212;" title="Deep Night"></button>
        </div>
      </div>

      <!-- Font Family Selector -->
      <div class="mb-3">
        <div class="control-label">Font Family</div>
        <select class="form-select form-select-sm custom-select" id="fontFamilySelect">
          <option value="'Lora', serif" selected>Lora (Serif)</option>
          <option value="'Noto Sans Ol Chiki', sans-serif">Ol Chiki (ᱚᱞ ᱪᱤᱠᱤ)</option>
          <option value="'Merriweather', serif">Merriweather</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Open Sans', sans-serif">Open Sans</option>
          <option value="'Bitter', serif">Bitter</option>
          <option value="'Roboto', sans-serif">Roboto</option>
        </select>
      </div>

      <!-- Font Size -->
      <div class="mb-3">
        <div class="control-label">Font Size</div>
        <div class="input-group input-group-sm">
          <button class="btn btn-outline-secondary" id="fontSizeDecBtn"><i class="fa-solid fa-minus"></i></button>
          <input type="text" class="form-control text-center" id="fontSizeLabel" value="100%" readonly>
          <button class="btn btn-outline-secondary" id="fontSizeIncBtn"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <!-- Page Spread -->
      <div class="mb-3">
        <div class="control-label">Page Spread</div>
        <div class="btn-group btn-group-sm w-100" role="group">
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadAuto" autocomplete="off" checked>
          <label class="btn btn-outline-secondary" for="spreadAuto">Auto</label>
          <input type="radio" class="btn-check" name="spreadOpt" id="spreadSingle" autocomplete="off">
          <label class="btn btn-outline-secondary" for="spreadSingle">Single</label>
        </div>
      </div>
    </aside>
  </div>

  <script>
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 'p', 's', 'u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const rawParamId = urlParams.get('id') || urlParams.get('book_id');

    let epubBook = null;
    let epubRendition = null;
    let currentUser = null;
    let currentBookId = null;
    let currentFontSize = 100;
    let currentFontFamily = "'Lora', serif";
    let currentThemeBg = '#ffffff';
    let currentThemeText = '#1f2937';
    let activeIframeDocs = [];

    // Mobile sidebar triggers
    const leftSidebar = document.getElementById('leftSidebar');
    const rightSidebar = document.getElementById('rightSidebar');
    document.getElementById('toggleLeftDrawerBtn')?.addEventListener('click', () => leftSidebar.classList.toggle('show'));
    document.getElementById('toggleRightDrawerBtn')?.addEventListener('click', () => rightSidebar.classList.toggle('show'));
    document.getElementById('closeRightSidebar')?.addEventListener('click', () => rightSidebar.classList.remove('show'));

    // Master CSS injector into EPUB iframes
    function applyStylesDirectly() {
      const viewer = document.getElementById('epub-viewer');
      if (viewer) viewer.style.backgroundColor = currentThemeBg;

      activeIframeDocs.forEach(doc => {
        if (!doc) return;
        let styleTag = doc.getElementById('custom-reader-style');
        if (!styleTag) {
          styleTag = doc.createElement('style');
          styleTag.id = 'custom-reader-style';
          doc.head.appendChild(styleTag);
        }
        
        styleTag.innerHTML = `
          html, body, p, div, span, h1, h2, h3, h4, h5, h6, li, a {
            background-color: ${currentThemeBg} !important;
            color: ${currentThemeText} !important;
            font-family: ${currentFontFamily} !important;
          }
          body {
            font-size: ${currentFontSize}% !important;
          }
          * {
            -webkit-user-select: none !important;
            user-select: none !important;
          }
        `;
      });
    }

    // 1. Font Change
    document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
      currentFontFamily = e.target.value;
      applyStylesDirectly();
    });

    // 2. 5 Background Color Presets
    document.querySelectorAll('.theme-swatch').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-swatch').forEach(b => b.classList.remove('active'));
        const target = e.currentTarget;
        target.classList.add('active');

        currentThemeBg = target.getAttribute('data-bg');
        currentThemeText = target.getAttribute('data-text');

        applyStylesDirectly();
      });
    });

    // Font Sizing
    document.getElementById('fontSizeIncBtn').addEventListener('click', () => {
      if (currentFontSize < 180) {
        currentFontSize += 10;
        document.getElementById('fontSizeLabel').value = `${currentFontSize}%`;
        applyStylesDirectly();
      }
    });

    document.getElementById('fontSizeDecBtn').addEventListener('click', () => {
      if (currentFontSize > 70) {
        currentFontSize -= 10;
        document.getElementById('fontSizeLabel').value = `${currentFontSize}%`;
        applyStylesDirectly();
      }
    });

    // Page Spread
    document.getElementById('spreadAuto').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('auto');
    });
    document.getElementById('spreadSingle').addEventListener('change', () => {
      if (epubRendition) epubRendition.spread('none');
    });

    function hideLoader() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    async function initUserSession() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        currentUser = user;
        const { data: profile } = await supabase
          .from('profiles')
          .select('full_name, first_name, username')
          .eq('id', user.id)
          .maybeSingle();

        const name = profile?.full_name || profile?.first_name || profile?.username || user.email.split('@')[0];
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      } else {
        document.getElementById('userName').textContent = "Guest Reader";
        document.getElementById('userAvatar').textContent = "G";
      }
    }

    async function fetchBookRecord(idVal) {
      let { data } = await supabase.from('books').select('*').eq('book_id', idVal).maybeSingle();
      if (data) return data;

      let res2 = await supabase.from('books').select('*').eq('id', idVal).maybeSingle();
      if (res2.data) return res2.data;

      return null;
    }

    // 3. Database Progress Write (Works with reading_progress: id, user_id, book_id, pages_read, total_pages, last_read_at, status)
    async function recordProgress(pageNo, totalPages) {
      if (!currentUser || !currentBookId) return;

      const p = Math.max(1, parseInt(pageNo, 10) || 1);
      const t = Math.max(1, parseInt(totalPages, 10) || 1);
      const readingStatus = p >= t ? 'completed' : 'in_progress';

      try {
        const { data: existing } = await supabase
          .from('reading_progress')
          .select('id')
          .eq('user_id', currentUser.id)
          .eq('book_id', String(currentBookId))
          .maybeSingle();

        if (existing && existing.id) {
          await supabase
            .from('reading_progress')
            .update({
              pages_read: p,
              total_pages: t,
              status: readingStatus,
              last_read_at: new Date().toISOString()
            })
            .eq('id', existing.id);
        } else {
          await supabase
            .from('reading_progress')
            .insert({
              user_id: currentUser.id,
              book_id: String(currentBookId),
              pages_read: p,
              total_pages: t,
              status: readingStatus,
              last_read_at: new Date().toISOString()
            });
        }
      } catch (err) {
        console.warn("Progress update warning:", err);
      }
    }

    async function loadBookData() {
      await initUserSession();

      if (!rawParamId) {
        alert("No book selected. Returning to dashboard.");
        window.location.href = "reader-dashboard.html";
        return;
      }

      try {
        const book = await fetchBookRecord(rawParamId);
        if (!book) throw new Error("Book record not found in database.");

        currentBookId = book.book_id || book.id;

        const title = book.title || book.book_name || 'Untitled Book';
        const author = book.author || book.author_name || (book.author_id ? `Author #${book.author_id}` : 'Unknown Author');
        const description = book.description || book.summary || 'No description available.';
        const cover = book.cover_url || book.thumbnail_url || book.image_url || 'https://placehold.co/130x180/5c4bca/ffffff?text=eBook';
        const fileUrl = book.file_url || book.pdf_url || book.epub_url || book.download_url || book.book_url;
        const fileType = (book.file_type || book.format || (fileUrl && fileUrl.endsWith('.pdf') ? 'pdf' : 'epub')).toLowerCase();

        document.getElementById('topBookTitle').textContent = title;
        document.getElementById('sidebarTitle').textContent = title;
        document.getElementById('sidebarAuthor').textContent = `By ${author}`;
        document.getElementById('sidebarPanelContent').textContent = description;
        document.getElementById('sidebarFormatBadge').textContent = fileType.toUpperCase();
        document.getElementById('sidebarCover').src = cover;

        if (!fileUrl) throw new Error("No readable book file is associated with this entry.");

        // Record initial start engagement immediately
        await recordProgress(1, 100);

        if (fileType === 'pdf' || fileUrl.toLowerCase().endsWith('.pdf')) {
          renderPdf(fileUrl);
        } else {
          renderEpub(fileUrl);
        }

      } catch (err) {
        console.error("Reader Error:", err);
        hideLoader();
        document.getElementById('sidebarPanelContent').innerHTML = `<span class="text-danger">${err.message}</span>`;
        document.getElementById('topBookTitle').textContent = 'Error Loading Book';
      }
    }

    function renderEpub(url) {
      epubBook = ePub(url);
      epubRendition = epubBook.renderTo("epub-viewer", { 
        width: "100%", 
        height: "100%",
        spread: "auto"
      });

      epubRendition.hooks.content.register((contents) => {
        const doc = contents.document;
        activeIframeDocs.push(doc);

        const fontLink = doc.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = 'https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Georgia&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap';
        doc.head.appendChild(fontLink);

        applyStylesDirectly();

        doc.addEventListener('contextmenu', (e) => e.preventDefault());
        doc.addEventListener('copy', (e) => e.preventDefault());
        
        doc.addEventListener('click', (e) => {
          const width = doc.documentElement.clientWidth;
          if (e.clientX < width * 0.25) goPrev();
          else if (e.clientX > width * 0.75) goNext();
        });
      });

      const goPrev = () => epubRendition && epubRendition.prev();
      const goNext = () => epubRendition && epubRendition.next();

      document.getElementById('tapLeft').addEventListener('click', goPrev);
      document.getElementById('tapRight').addEventListener('click', goNext);

      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') goPrev();
        if (e.key === 'ArrowRight') goNext();
      });

      epubRendition.display().then(() => hideLoader());

      epubBook.ready
        .then(() => epubBook.locations.generate(1024))
        .then(() => {
          const totalLocs = epubBook.locations.total || 100;
          document.getElementById('topTotalPages').textContent = totalLocs;

          epubRendition.on('relocated', (location) => {
            const currentCfi = location.start.cfi;
            const currentLoc = epubBook.locations.locationFromCfi(currentCfi) || 1;
            
            document.getElementById('topPageNum').textContent = currentLoc;
            document.getElementById('topTotalPages').textContent = totalLocs;
            
            const pct = Math.min(100, Math.round((currentLoc / totalLocs) * 100));
            document.getElementById('readingProgressBar').style.width = `${pct}%`;
            
            recordProgress(currentLoc, totalLocs);
          });
        })
        .catch(() => {
          // If generate fails, track page index changes directly
          let fallbackPage = 1;
          epubRendition.on('relocated', () => {
            fallbackPage++;
            document.getElementById('topPageNum').textContent = fallbackPage;
            recordProgress(fallbackPage, 100);
          });
        });
    }

    function renderPdf(url) {
      hideLoader();
      document.getElementById('epub-viewer').classList.add('d-none');
      document.getElementById('topPageIndicator').classList.add('d-none');
      document.getElementById('rightSidebar').classList.add('d-none');
      document.getElementById('tapLeft').classList.add('d-none');
      document.getElementById('tapRight').classList.add('d-none');

      const pdfFrame = document.getElementById('pdf-viewer-frame');
      pdfFrame.classList.remove('d-none');
      pdfFrame.src = `${url}#toolbar=0&navpanes=0&scrollbar=1`;
    }

    document.addEventListener("DOMContentLoaded", loadBookData);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
