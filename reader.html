<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mode | Santali Digital Library</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Georgia&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  
  <style>
    :root {
      --brand-primary: #5c4bca;
      --topbar-bg: #151623;
      --topbar-text: #ffffff;
      --panel-bg: #ffffff;
      --center-bg: #f5f6f8;
      --text-main: #2b2f38;
      --text-muted: #6c757d;
      --border-color: #e5e7eb;
      --card-bg: #f8f9fa;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none !important;
      user-select: none !important;
    }
    
    body {
      background-color: var(--panel-bg);
      color: var(--text-main);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    .top-navbar {
      background-color: var(--topbar-bg);
      color: var(--topbar-text);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      flex-shrink: 0;
      z-index: 1030;
    }

    .progress-bar-container {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.3s ease;
    }

    .app-body { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

    .sidebar {
      width: 300px;
      background-color: var(--panel-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 1020;
    }

    .left-sidebar { border-right: 1px solid var(--border-color); }
    .right-sidebar { border-left: 1px solid var(--border-color); padding: 1.25rem; }

    .reader-profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reader-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--brand-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .book-cover-container { padding: 1rem; text-align: center; }
    .cover-wrapper { 
      width: 110px; 
      height: 155px; 
      margin: 0 auto 10px; 
      border-radius: 6px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .center-workspace {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--center-bg);
      position: relative;
      overflow: hidden;
    }

    .reader-container { 
      flex-grow: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 1rem;
    }
    
    #epub-viewer { 
      width: 100%; 
      max-width: 900px; 
      height: 100%; 
      background: #ffffff; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border-radius: 8px; 
      overflow: hidden;
      position: relative;
    }

    .tap-target {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 15;
      cursor: pointer;
    }
    .tap-target.left { left: 0; }
    .tap-target.right { right: 0; }

    #pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    #loadingOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--center-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <nav class="top-navbar position-relative">
    <div class="d-flex align-items-center gap-2">
      <a href="reader-dashboard.html" class="btn btn-sm btn-outline-light border-0" id="backToLibraryBtn">
        <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
      </a>
    </div>

    <div class="text-center px-2 text-truncate" style="max-width: 50%;">
      <h1 id="topBookTitle" class="fs-6 m-0 fw-bold text-truncate text-white">Loading...</h1>
      <small class="text-white-50" id="topPageIndicator">Page <span id="topPageNum">1</span> of <span id="topTotalPages">--</span> (<span id="topPercent">0%</span>)</small>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="readingProgressBar"></div>
    </div>
  </nav>

  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="sidebar left-sidebar" id="leftSidebar">
      <div class="reader-profile-card">
        <div class="reader-avatar" id="userAvatar">U</div>
        <div class="overflow-hidden">
          <div class="fw-bold small text-truncate" id="userName">Checking user...</div>
          <div class="text-muted" style="font-size: 0.72rem;"><i class="fa-solid fa-circle text-success me-1" style="font-size: 0.5rem;"></i>Reading</div>
        </div>
      </div>

      <div class="book-cover-container">
        <div class="cover-wrapper">
          <img id="sidebarCover" src="https://placehold.co/130x180/5c4bca/ffffff?text=eBook" alt="Book Cover">
        </div>
        <h2 id="sidebarTitle" class="fs-6 fw-bold mb-1 text-truncate">Loading...</h2>
        <p id="sidebarAuthor" class="small text-muted mb-2">-</p>
      </div>
    </aside>

    <!-- Center Workspace -->
    <main class="center-workspace">
      <div id="loadingOverlay">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div class="small text-muted" id="loadingStatus">Loading document...</div>
      </div>

      <div class="reader-container" id="readerContainer">
        <div class="tap-target left" id="tapLeft" title="Previous Page"></div>
        <div class="tap-target right" id="tapRight" title="Next Page"></div>

        <div id="epub-viewer"></div>
        <iframe id="pdf-viewer-frame" class="d-none" title="PDF Viewer"></iframe>
      </div>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const rawParamId = urlParams.get('id') || urlParams.get('book_id');
    const paramPage = parseInt(urlParams.get('page'), 10) || null;
    const paramCfi = urlParams.get('cfi') || null;

    let epubBook = null;
    let epubRendition = null;
    let currentUser = null;
    let resolvedBookId = null;
    let currentAuthorId = urlParams.get('author_id') || null;
    let currentAuthorName = urlParams.get('author') || 'Unknown Author';

    let pageDwellTimer = null;
    let activeTrackedPage = null;
    const MIN_DWELL_SECONDS = 10;

    function hideLoader() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    async function initUserSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        const { data: profile } = await supabase
          .from('profiles')
          .select('full_name, first_name')
          .eq('id', currentUser.id)
          .maybeSingle();

        const name = profile?.full_name || profile?.first_name || currentUser.email.split('@')[0];
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      }
    }

    async function fetchBookRecord(paramId) {
      if (!paramId) return null;
      let { data: b1 } = await supabase.from('books').select('*').eq('id', paramId).maybeSingle();
      if (b1) return b1;

      let { data: b2 } = await supabase.from('books').select('*').eq('book_id', paramId).maybeSingle();
      if (b2) return b2;

      return null;
    }

    // Records page reads that exceed the 10-second dwell time threshold
    function startPageDwellTracker(pageNo) {
      if (pageDwellTimer) clearTimeout(pageDwellTimer);
      activeTrackedPage = pageNo || 1;

      console.log(`[Dwell Timer] Started tracking Page ${activeTrackedPage}. Will commit in ${MIN_DWELL_SECONDS}s.`);

      pageDwellTimer = setTimeout(async () => {
        if (!resolvedBookId) return;

        const { data: { session } } = await supabase.auth.getSession();
        const uId = session?.user?.id || currentUser?.id || null;

        const payload = {
          book_id: String(resolvedBookId),
          author_id: String(currentAuthorId || ''),
          author_name: String(currentAuthorName || 'Unknown Author'),
          page_number: parseInt(activeTrackedPage, 10) || 1,
          seconds_spent: MIN_DWELL_SECONDS
        };
        if (uId) {
          payload.user_id = uId;
        }

        try {
          const { error } = await supabase.from('page_read_events').insert([payload]);
          if (!error) {
            console.info(`[Analytics] Successfully logged verified read for Page ${activeTrackedPage} by Author ${currentAuthorName}`);
          } else {
            console.error("[Analytics Error] Insert failed:", error.message);
          }
        } catch (e) {
          console.error("Read logging exception:", e);
        }
      }, MIN_DWELL_SECONDS * 1000);
    }

    async function loadBookData() {
      await initUserSession();

      if (!rawParamId) {
        window.location.href = "reader-dashboard.html";
        return;
      }

      try {
        const book = await fetchBookRecord(rawParamId);
        if (!book) throw new Error("Book record not found.");

        resolvedBookId = book.book_id || book.id;
        currentAuthorName = book.author || currentAuthorName || 'Unknown Author';
        currentAuthorId = book.author_id || currentAuthorId || `AUTH-${String(currentAuthorName).replace(/\s+/g, '').substring(0, 6).toUpperCase()}`;

        const title = book.title || 'Untitled Book';
        const cover = book.cover_url || 'https://placehold.co/130x180/5c4bca/ffffff?text=eBook';
        const fileUrl = book.file_url || book.pdf_url || book.epub_url;
        const fileType = (book.file_type || (fileUrl && fileUrl.endsWith('.pdf') ? 'pdf' : 'epub')).toLowerCase();

        document.getElementById('topBookTitle').textContent = title;
        document.getElementById('sidebarTitle').textContent = title;
        document.getElementById('sidebarAuthor').textContent = `By ${currentAuthorName}`;
        document.getElementById('sidebarCover').src = cover;

        if (fileType === 'pdf' || (fileUrl && fileUrl.toLowerCase().endsWith('.pdf'))) {
          renderPdf(fileUrl, paramPage || 1);
        } else {
          renderEpub(fileUrl, paramCfi, paramPage);
        }
      } catch (err) {
        hideLoader();
        document.getElementById('topBookTitle').textContent = 'Error Loading Book';
      }
    }

    function renderEpub(url, targetCfi = null, targetPage = null) {
      epubBook = ePub(url);
      epubRendition = epubBook.renderTo("epub-viewer", { width: "100%", height: "100%", spread: "auto" });

      const goPrev = () => epubRendition && epubRendition.prev();
      const goNext = () => epubRendition && epubRendition.next();

      document.getElementById('tapLeft').addEventListener('click', goPrev);
      document.getElementById('tapRight').addEventListener('click', goNext);

      epubRendition.display(targetCfi || undefined).then(() => {
        hideLoader();
        startPageDwellTracker(targetPage || 1);
      });

      let currentGeneratedPage = targetPage || 1;
      let totalGeneratedPages = 100;

      epubBook.ready
        .then(() => epubBook.locations.generate(1024))
        .then(() => {
          totalGeneratedPages = epubBook.locations.total || 100;
          document.getElementById('topTotalPages').textContent = totalGeneratedPages;
        });

      epubRendition.on('relocated', (location) => {
        let currentCfi = location.start.cfi;
        if (epubBook.locations && epubBook.locations.total) {
          currentGeneratedPage = epubBook.locations.locationFromCfi(currentCfi) || 1;
          totalGeneratedPages = epubBook.locations.total || 100;
        }

        const pct = Math.min(100, Math.max(1, Math.round((currentGeneratedPage / totalGeneratedPages) * 100)));
        document.getElementById('topPageNum').textContent = currentGeneratedPage;
        document.getElementById('topTotalPages').textContent = totalGeneratedPages;
        document.getElementById('topPercent').textContent = `${pct}%`;
        document.getElementById('readingProgressBar').style.width = `${pct}%`;

        startPageDwellTracker(currentGeneratedPage);
      });
    }

    function renderPdf(url, targetPage = 1) {
      hideLoader();
      document.getElementById('epub-viewer').classList.add('d-none');
      document.getElementById('tapLeft').classList.add('d-none');
      document.getElementById('tapRight').classList.add('d-none');

      const pdfFrame = document.getElementById('pdf-viewer-frame');
      pdfFrame.classList.remove('d-none');
      pdfFrame.src = `${url}#page=${targetPage}&toolbar=0`;

      document.getElementById('topPageNum').textContent = targetPage;
      startPageDwellTracker(targetPage);
    }

    document.addEventListener("DOMContentLoaded", loadBookData);
  </script>
</body>
</html>
