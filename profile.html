<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Santali Digital Library</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .profile-card {
      border-radius: 12px;
      border: none;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      background-color: #005f73;
      color: white;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 1rem auto;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-teal sticky-top" style="background-color: #005f73;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fa-solid fa-book-open-reader text-warning fs-3"></i>
        <span>Santali Digital <span class="text-warning fw-bold">Library</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
          <!-- User Profile Dropdown Area (Injected by auth.js) -->
          <li class="nav-item ms-lg-3 my-2 my-lg-0" id="userNavArea">
            <a href="login.html" class="btn btn-warning btn-sm fw-bold">Login / Sign Up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Profile Content Container -->
  <div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Alert Box -->
        <div id="profileAlert" class="alert d-none text-center" role="alert"></div>

        <div class="card shadow-sm profile-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="profile-avatar shadow-sm">
              <i class="fa-solid fa-user"></i>
            </div>
            <h3 id="userDisplayName" class="fw-bold mb-1">Loading Profile...</h3>
            <p id="userEmailDisplay" class="text-muted mb-2"></p>
            <span id="userRoleBadge" class="badge"></span>
          </div>

          <form id="profileForm">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Personal Information</h5>
            
            <div class="row g-3">
              <!-- Full Name -->
              <div class="col-md-12">
                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>

              <!-- Phone Number -->
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                <input type="text" class="form-control" id="phone">
              </div>

              <!-- Role (Read-only view) -->
              <div class="col-md-6">
                <label for="roleDisplay" class="form-label fw-semibold">Account Type</label>
                <input type="text" class="form-control bg-light" id="roleDisplay" readonly disabled>
              </div>

              <!-- Address -->
              <div class="col-12">
                <label for="address" class="form-label fw-semibold">Address</label>
                <textarea class="form-control" id="address" rows="3"></textarea>
              </div>
            </div>

            <!-- Save Changes Button -->
            <div class="text-end mt-4">
              <button type="submit" class="btn btn-warning fw-bold px-4 py-2 text-dark shadow-sm">
                <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-teal text-center mt-auto py-3" style="background-color: #005f73;">
    <div class="container">
      <p class="mb-1 fw-bold text-white">&copy; 2026 Santali Digital Library</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Global Auth Script -->
  <script type="module" src="assets/js/auth.js"></script>

  <!-- Profile Data Script -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // =========================================================
    // ⚠️ REPLACE THESE WITH YOUR ACTUAL SUPABASE KEYS
    // =========================================================
    const SUPABASE_URL = 'https://qdzadypqtctjonnwgxoo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkemFkeXBxdGN0am9ubndneG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTIyMTYsImV4cCI6MjEwMTc2ODIxNn0.yE6C0ajDrbgJj3RbvH6X9liCoTYsXpd2RUpGRHbjcf8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      const alertBox = document.getElementById("profileAlert");
      const profileForm = document.getElementById("profileForm");

      function showAlert(message, type) {
        alertBox.className = `alert alert-${type} text-center`;
        alertBox.textContent = message;
        alertBox.classList.remove("d-none");
      }

      try {
        // 1. Get logged-in user
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        if (userError || !user) {
          window.location.href = "login.html"; // Redirect if not logged in
          return;
        }

        document.getElementById("userEmailDisplay").innerText = user.email;

        // 2. Fetch profile details from database
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        if (profileError) throw profileError;

        // 3. Populate form fields
        document.getElementById("fullName").value = profile.full_name || '';
        document.getElementById("phone").value = profile.phone || '';
        document.getElementById("address").value = profile.address || '';
        document.getElementById("userDisplayName").innerText = profile.full_name || 'My Profile';
        
        const roleText = profile.role ? profile.role.toUpperCase() : 'READER';
        document.getElementById("roleDisplay").value = roleText;

        const roleBadge = document.getElementById("userRoleBadge");
        if (profile.role === 'author') {
          roleBadge.className = "badge bg-warning text-dark px-3 py-2";
          roleBadge.innerText = "Publisher / Author Account";
        } else {
          roleBadge.className = "badge bg-secondary px-3 py-2";
          roleBadge.innerText = "Reader Account";
        }

        // 4. Handle form submission to update profile
        profileForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const updatedName = document.getElementById("fullName").value.trim();
          const updatedPhone = document.getElementById("phone").value.trim();
          const updatedAddress = document.getElementById("address").value.trim();

          const { error: updateError } = await supabase
            .from('profiles')
            .update({
              full_name: updatedName,
              phone: updatedPhone,
              address: updatedAddress
            })
            .eq('id', user.id);

          if (updateError) throw updateError;

          document.getElementById("userDisplayName").innerText = updatedName;
          showAlert("Profile updated successfully!", "success");
        });

      } catch (error) {
        console.error("Profile Error:", error);
        showAlert("Failed to load profile details.", "danger");
      }
    });
  </script>
</body>
</html>
